ckground:white;color:var(--navy);border-color:#bdcecd}.button:hover{filter:brightness(.94)}.privacy{font-size:12px;color:var(--muted);margin:20px 0 0}.hidden{display:none!important}

<script id="content-data" type="application/json">{"en":{"title":"A Quiet Self-Check","subtitle":"Looking back at how you learn","intro":["Think about an assignment, project or learning task you completed recently.","As you answer five short questions, consider how you approached the work, what helped or held you back, and what you might do differently next time.","There are no right or wrong answers, and no scores. Choose the response closest to your experience and explore the feedback."],"questions":[{"label":"Structure","title":"How did you find your way into the task?","lead":"When you began, which best describes what happened?","options":[{"option":"I understood what was required and could identify a manageable first step.","feedback":"Having a clear starting point may have helped you make progress. What helped you get that clarity—the brief, feedback, a discussion, or something else? Could you use that approach again?"},{"option":"I understood the general topic, but was unsure what the task really asked me to produce.","feedback":"Knowing the topic and knowing the task are different. What, specifically, remained unclear: the question, the expected output, or the marking criteria? How might you clarify it earlier next time?"},{"option":"I knew what to do but struggled to turn it into a first action.","feedback":"A clear goal does not always lead to action. What made starting difficult? Would breaking the work into one small, concrete step have helped—or was another kind of support needed?"},{"option":"I followed an example or someone else’s plan without fully working out my own route.","feedback":"Examples can be useful starting points, but they may also shape your choices before you have considered them. What did you understand about the task yourself, and where did you rely on the example?"}]},{"label":"Judgement","title":"How did you decide what mattered?","lead":"When you had to choose an approach, idea or piece of evidence, what did you tend to do?","options":[{"option":"I compared possibilities and could explain why I chose one.","feedback":"That is one way of exercising judgement. What criteria or evidence influenced your choice? Could you also explain a limitation or a reasonable alternative?"},{"option":"I mainly followed what the instructions or marking criteria appeared to require.","feedback":"Following requirements is essential. But some tasks leave decisions open. Were there any choices that the instructions could not make for you? How did you handle those?"},{"option":"I chose what seemed easiest or most familiar because I was uncertain.","feedback":"A familiar approach may be sensible, especially under constraints, but it is worth examining. What made the other options harder to judge? What information would have helped you decide?"},{"option":"I accepted a convincing suggestion from a source, classmate or AI tool without checking it closely.","feedback":"Useful suggestions can save time, but sounding convincing is not the same as being suitable. What could you have checked—relevance, evidence, assumptions or fit with the task?"}]},{"label":"Rhythm","title":"What helped you keep going?","lead":"As the task continued, what most closely describes your working pattern?","options":[{"option":"I made manageable progress and adjusted my plan when necessary.","feedback":"A workable rhythm is not the same as doing everything perfectly. What helped you return to the task when plans changed?"},{"option":"I worked in intense bursts, especially when the deadline approached.","feedback":"Deadlines can help focus attention, but an intense burst may also be costly. Did this pattern suit the task, or did it leave something important unfinished?"},{"option":"I lost momentum and found it difficult to restart.","feedback":"The useful question is not simply why you stopped, but what made returning difficult. Was the next step unclear, the task overwhelming, or something else happening?"},{"option":"I kept working, but the pace was difficult to sustain.","feedback":"Continuing despite pressure can feel productive, yet it may not be sustainable. What did the pace cost you, and what could you adjust without abandoning the work?"}]},{"label":"Collaboration","title":"How did you use people and tools when completing your task?","lead":"Think about the assignment or project you completed. Did you use feedback, discussions with others, or tools such as AI? Which experience comes closest to yours?","options":[{"option":"I considered suggestions from others or AI, then decided what to use, question or change.","feedback":"Collaboration can help you see different possibilities while retaining your own judgement. What did you learn from the suggestions, and why did you choose to use or reject them?"},{"option":"I generally followed the guidance or suggestions I received because I trusted the source.","feedback":"Trusting a knowledgeable person or useful tool can be reasonable. But did you consider whether the suggestions suited your task? Could you explain why you followed them?"},{"option":"I mostly worked independently, with little input from others or AI.","feedback":"Independent work can be valuable. Other perspectives may also help you question assumptions or recognise something overlooked. Could collaboration have added something useful to this task?"},{"option":"I received different or conflicting suggestions and was unsure which to follow.","feedback":"Different suggestions do not necessarily mean one is right and another wrong. What reasons were behind them? How might you decide which approach best suited your task?"}]},{"label":"Human Relationships","title":"Who shared your experience during that time?","lead":"Think about the people around you while you were working on your assignment or project. They did not need to help with the task itself. Which experience comes closest to yours?","options":[{"option":"I had people I could share my difficulties or achievements with.","feedback":"Having someone who listens, understands or celebrates with you can make the experience more meaningful. Who has been important to you, and how do you maintain that connection?"},{"option":"I had people around me, but I rarely shared how I was feeling or what I was experiencing.","feedback":"Being surrounded by people does not always mean feeling connected. Was keeping your experiences to yourself a conscious choice, or did something make sharing difficult?"},{"option":"I often felt that I was facing my difficulties and achievements alone.","feedback":"Managing your studies independently is one thing; feeling alone in the experience is another. Is there someone you might want to connect with, even if you do not need help with the task?"},{"option":"I was comfortable managing this experience myself, but knew I had people I could turn to.","feedback":"You do not need to share every experience. Being comfortable on your own can be valuable, while knowing people are there for you can provide reassurance. What helps you maintain that balance?"}]}],"progress":"Question","choose":"Choose the response closest to your experience.","feedback":"Something to consider","previous":"Previous","next":"Next question","toReflection":"View my learning picture","restart":"Start again","summaryTitle":"Your Learning at a Glance","summary":["Look back at your five answers. Which areas seemed to work well, and which might need more attention?","Use the QRenewal diagram to reflect on each area. Choose Working well, Needs attention or Not sure yet. The areas can become brighter or dimmer to show your own reflection—not a score or an assessment of ability.","Your picture may change depending on the task and your circumstances. A less bright area does not automatically need to be your next priority."],"states":["Not sure yet","Working well","Needs attention"],"nextTitle":"Your Next Step","nextIntro":"Look at your QRenewal diagram. Choose one area you would like to work on, and see a practical idea you could try in your next task.","actions":["Make the task and first step clearer.","Compare alternatives and explain a choice.","Build a manageable pace and a way to restart.","Use people and tools appropriately while retaining decisions.","Make space for connection, whether or not you need help with the task."],"prompts":["One thing I noticed about my learning was…","Next time, I will try…","I will know whether it helped by…"],"explore":"Explore Further","exploreText":"Your Quiet Self-Check is just a starting point. In Your Guide to Studying in the UK: Developing Judgement, Agency and Confidence while Learning, explore the QRenewal Learning System in greater depth, with practical examples and strategies to help you understand your learning, make decisions and move forward with confidence.","book":"Explore the Book","home":"Back to homepage","selectArea":"Choose an area","notSaved":"Your responses stay in this browser tab while this page is open. They are not submitted or saved by this website.","feedbackNote":"There is no right or wrong answer. This is a reflection, not a score.","caption":"The diagram reflects your own choices, not a measurement of ability.","legend":"Diagram controls","diagramLabel":"QRenewal learning picture","incomplete":"You can continue without selecting an answer.","suggestionTitle":"Something you could try","suggestionHint":"This is a starting point, not a fixed instruction. Choose an action that fits your situation.","actionPrompt":"One small change I will try next time is…","actionPlaceholder":"My next step (optional)","afterAction":"Try one small change, notice what happens and adjust if needed.","suggestions":["Before starting your next assignment, read the brief and identify what you need to produce, what remains unclear and one small step you can begin.","When choosing an argument, method or source, compare two possible approaches and note why one better fits your assignment.","For your next study session, choose one manageable task. Before finishing, note where you will pick up the work next time.","Identify one point in your next assignment where feedback, discussion or permitted AI support might help. Consider what it adds, then decide what to use and why.","Think of someone you would like to stay connected with while working on your next task. Share how things are going, whether or not you need help with the work."]},"zh":{"title":"静心自查","subtitle":"回头看看，你是怎样学习的","intro":["回想一下你最近完成的一份作业、一个项目或一项学习任务。","通过下面五个简短的问题，回顾自己是如何完成任务的：哪些做法对你有帮助？遇到了什么困难？下次可以尝试哪些不同的方式？","这里没有标准答案，也不计分。 选择最符合你实际经历的选项，看看相应的反馈能否带给你一些新的思考。"],"questions":[{"label":"结构 Structure","title":"你是如何开始这项任务的？","lead":"刚开始时，以下哪种情况最接近你的经历？","options":[{"option":"我清楚任务要求，也知道可以从哪里开始。","feedback":"有一个清晰的起点，往往能让任务更容易推进。当时是什么帮助你明确了方向？是任务说明、老师的指导、与他人的讨论，还是其他原因？下次还能用同样的方法吗？"},{"option":"我大致了解任务的主题，却不太清楚具体要完成什么。","feedback":"了解主题，不等于理解任务要求。当时让你困惑的是什么？是题目本身、需要提交的内容，还是评分标准？下次怎样才能更早弄清楚这些问题？"},{"option":"我知道要做什么，却迟迟不知道该如何动手。","feedback":"知道目标，不代表就能顺利开始。当时是什么让你难以迈出第一步？把任务分成几个小步骤是否会有帮助？或者，你需要的是其他方面的支持？"},{"option":"我主要参考范例或别人的计划，没有认真考虑自己的做法。","feedback":"参考范例可以帮助我们找到方向，但也可能让我们不知不觉地沿用别人的思路。回头看看，哪些决定是你自己作出的？哪些主要来自范例或他人的安排？"}]},{"label":"判断 Judgement","title":"你是如何作出选择的？","lead":"完成任务时，你可能需要选择方法、观点或证据。以下哪种情况最接近你的经历？","options":[{"option":"我比较过不同的做法，也能解释自己为什么这样选择。","feedback":"比较不同的可能性，并说明选择的理由，就是运用判断的一种方式。当时你依据了哪些理由或证据？现在回头看，这个选择有没有什么局限？是否还存在其他合理的做法？"},{"option":"我主要根据任务说明或评分标准来决定怎么做。","feedback":"遵循任务要求很重要。不过，有些决定无法直接从说明或评分标准中找到答案。当时有没有需要你自己拿主意的地方？你是怎么处理的？"},{"option":"因为不太确定，我选择了最熟悉或最容易的方法。","feedback":"在时间有限或情况不明确时，选择熟悉的方法未必不合理。不过，你是否考虑过其他可能性？如果重新选择，你还需要了解哪些信息？"},{"option":"我接受了资料、同学或 AI 给出的建议，却没有仔细核实。","feedback":"一个建议听起来有道理，并不代表它一定正确或适合你的任务。回头看看，当时有哪些地方值得进一步核实？例如，建议是否切合题目、证据是否可靠、背后的假设是否合理？"}]},{"label":"节奏 Rhythm","title":"你是怎样保持进度的？","lead":"在完成任务的过程中，以下哪种情况最接近你的经历？","options":[{"option":"我能够一步步推进，并根据实际情况调整计划。","feedback":"保持稳定的学习节奏，并不意味着一切都要按计划进行。当计划被打乱时，你是怎样调整并继续推进的？哪些做法值得保留？"},{"option":"我经常等到截止日期临近，才集中精力赶进度。","feedback":"截止日期有时确实能让人更加专注。但回头看看，这种方式适合当时的任务吗？有没有因为时间紧张而忽略了重要的事情？下次是否需要调整？"},{"option":"我曾经中断了一段时间，之后很难重新开始。","feedback":"值得思考的不只是为什么停下来，还有为什么难以重新开始。是因为不知道下一步该做什么、任务压力太大，还是生活中发生了其他事情？找到原因，可能有助于你重新起步。"},{"option":"我一直在努力推进，但感觉这样的节奏很难长期坚持。","feedback":"持续忙碌不一定意味着学习方式有效。你是否为此牺牲了休息、健康或其他重要的事情？怎样调整，才能既完成任务，又不过度消耗自己？"}]},{"label":"协作 Collaboration","title":"完成任务时，你是如何借助他人和工具的？","lead":"回想一下，你是否参考过老师或同学的意见、与他人讨论，或者使用过 AI 等工具？ 以下哪种情况最接近你的经历？","options":[{"option":"我会考虑他人或 AI 的建议，再自己决定哪些可以采纳、质疑或调整。","feedback":"借助他人或工具，可以帮助我们发现不同的可能性，但最终仍需要自己作出判断。你从这些建议中获得了什么？为什么决定采纳或放弃某些建议？"},{"option":"因为信任建议的来源，我通常会按照得到的指导或建议去做。","feedback":"听取有经验的人的意见，或使用可靠的工具，都是合理的做法。不过，你是否考虑过这些建议是否适合自己的任务？如果有人问你为什么这样做，你能解释其中的理由吗？"},{"option":"我基本独立完成任务，很少向他人寻求意见或使用 AI 等工具。","feedback":"独立完成任务有其价值，也不一定需要借助外部帮助。不过，不同的观点有时能帮助我们发现忽略的问题。回头看看，有没有哪个环节，如果听听别人的意见或借助合适的工具，可能会带来新的启发？"},{"option":"我得到了不同甚至相互矛盾的建议，不知道该听谁的。","feedback":"不同的建议未必只有一个正确答案。它们各自有什么依据？是否适用于不同的情况？如果再遇到类似问题，你会怎样判断哪一种建议更适合自己的任务？"}]},{"label":"人际关系 Human Relationships","title":"那段时间，你与身边的人有怎样的联系？","lead":"回想一下完成作业或项目期间，你与家人、朋友、同学或其他人的联系。他们不一定需要帮助你完成任务。 以下哪种情况最接近你的经历？","options":[{"option":"我有可以分享困难、收获或喜悦的人。","feedback":"有人愿意倾听、理解你，或与你分享成功的喜悦，可以让学习生活多一份支持和陪伴。回想一下，谁在这段时间里对你比较重要？你们平时是怎样保持联系的？"},{"option":"虽然身边有人，但我很少向他们分享自己的感受或经历。","feedback":"身边有人，并不一定意味着我们愿意向他们倾诉。你很少分享，是因为喜欢自己处理事情，还是有什么原因让你不愿开口？这种状态符合你的需要吗？"},{"option":"无论遇到困难还是取得成绩，我常常觉得只有自己一个人在面对。","feedback":"独立完成学业是一回事，在学习生活中感到孤单则是另一回事。即使不需要别人帮你完成任务，你是否也希望有人能够听你说说近况，或者与你分享生活中的一些时刻？"},{"option":"我习惯自己处理事情，但也知道需要时有人可以陪伴和支持我。","feedback":"并不是每件事都需要与别人分享。享受独处和保持与他人的联系并不矛盾。你是怎样在独立生活与人际联系之间找到适合自己的平衡的？"}]}],"progress":"第","progressSuffix":"题，共 5 题","choose":"选择最符合你实际经历的选项。","feedback":"想一想","previous":"上一题","next":"下一题","toReflection":"查看我的学习状态","restart":"重新开始","summaryTitle":"我的学习状态一览","summary":["回顾刚才的五个问题，想一想：哪些方面是你做得比较好的？哪些方面可能还需要多一些关注？","在下方的 QRenewal 学习系统图中，你可以为每个方面选择一种状态。随着你的选择，相应部分会变亮或变暗。这反映的是你对这次经历的看法，并不是能力测评。","面对不同的任务和生活情况，你的状态也可能不同。图中较暗的部分，不一定就是你现在最需要优先改善的地方。"],"states":["暂时不确定","表现良好","需要关注"],"nextTitle":"我的下一步","nextIntro":"看看你的 QRenewal 学习系统图，选择一个你想改善的方面，看看下一项任务中可以尝试什么具体做法。","actions":["弄清楚任务要求，找到可以开始的第一步。","比较不同的做法，学会解释自己选择的理由。","找到适合自己的学习节奏，即使中断了，也能重新开始。","合理利用他人和工具的帮助，同时自己作出重要决定。","与身边的人保持联系，让困难和喜悦都有人可以分享。"],"prompts":["通过这次回顾，我发现自己……","下次遇到类似任务时，我想尝试……","我可以通过……来看看这种改变是否有帮助。"],"explore":"进一步探索","exploreText":"这次静心自查只是一个开始。在《Your Guide to Studying in the UK: Developing Judgement, Agency and Confidence while Learning》一书中，你可以进一步了解 QRenewal Learning System，通过真实的学习经历、案例和实用方法，探索如何更好地理解自己的学习、作出判断，并逐步建立独立学习和应对挑战的信心。","book":"了解本书","home":"返回主页","selectArea":"选择一个方面","notSaved":"你的回答只会暂时显示在当前页面，不会提交给网站，也不会被网站保存。","feedbackNote":"没有标准答案，也不计分。","caption":"图中显示的是你自己的判断，而非能力测评结果。","legend":"学习状态选择","diagramLabel":"QRenewal 学习系统图","incomplete":"即使没有选择答案，你也可以继续。","suggestionTitle":"你可以试试这样做","suggestionHint":"这只是一个参考，你可以根据自己的情况选择更合适的做法。","actionPrompt":"下次，我准备尝试的一个小改变是……","actionPlaceholder":"写下自己的行动计划（选填）","afterAction":"从一个小改变开始，看看效果如何，再根据实际情况调整。","suggestions":["开始下一份作业前，先阅读任务说明，弄清需要完成什么、还有哪些地方不明白，再确定一个可以着手的小步骤。","选择论点、方法或资料时，试着比较两种做法，想清楚为什么其中一种更适合这份作业。","下次学习时，先选一件力所能及的小事来完成；结束前，记下下次准备从哪里继续。","想想下一份作业中，哪个环节可以借助反馈、讨论或符合规定的 AI 帮助。考虑这些建议有什么价值，再自己决定是否采用以及为什么。","想想在下一项任务期间，你希望与谁保持联系。可以分享自己的近况，不必等到需要对方帮忙完成任务时才联系。"]}}</script>
<script>
(()=>{'use strict';const DATA=JSON.parse(document.getElementById('content-data').textContent);const $=id=>document.getElementById(id);let lang='en',step=0,answers=[null,null,null,null,null],states=[0,0,0,0,0],chosenArea=null,actionNote='';
const names={en:['Structure','Judgement','Rhythm','Collaboration','Human Relationships'],zh:['结构 Structure','判断 Judgement','节奏 Rhythm','协作 Collaboration','人际关系 Human Relationships']};
function txt(id,value){$(id).textContent=value}
function pAppend(target,str){const p=document.createElement('p');p.textContent=str;target.append(p)}
function render(){const L=DATA[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=L.title+' | Studying in the UK';$('en-btn').setAttribute('aria-pressed',lang==='en');$('zh-btn').setAttribute('aria-pressed',lang==='zh');txt('back-link',L.home);txt('title',L.title);txt('subtitle',L.subtitle);$('intro').replaceChildren();L.intro.forEach(t=>pAppend($('intro'),t));txt('privacy',L.notSaved);$('questions-panel').classList.toggle('hidden',step===5);$('reflection-panel').classList.toggle('hidden',step!==5);
if(step<5){const q=L.questions[step];txt('progress',lang==='zh'?`第 ${step+1} 题，共 5 题`:`${L.progress} ${step+1} of 5`);$('progress-fill').style.width=((step+1)*20)+'%';txt('area',String(step+1).padStart(2,'0')+' · '+q.label);txt('question-title',q.title);txt('lead',q.lead);$('options').replaceChildren();q.options.forEach((opt,i)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='response';input.value=String(i);input.checked=answers[step]===i;input.addEventListener('change',()=>{answers[step]=i;render()});const letter=document.createElement('span');letter.className='answer-letter';letter.textContent='ABCD'[i]+'.';const text=document.createElement('span');text.textContent=opt.option;label.append(input,letter,text);$('options').append(label)});const a=answers[step];$('feedback-box').classList.toggle('hidden',a===null);if(a!==null){txt('feedback-label',L.feedback);txt('feedback-text',q.options[a].feedback)}txt('prev',L.previous);$('prev').disabled=step===0;txt('next',step===4?L.toReflection:L.next)}else{renderReflection()}}
function renderReflection(){const L=DATA[lang];txt('summary-title',L.summaryTitle);$('summary-text').replaceChildren();L.summary.forEach(t=>pAppend($('summary-text'),t));txt('caption',L.caption);txt('diagram-title',L.diagramLabel);txt('next-title',L.nextTitle);txt('next-intro',L.nextIntro);txt('explore-title',L.explore);txt('explore-text',L.exploreText);txt('book-link',L.book);txt('review',L.previous);txt('restart',L.restart);$('state-controls').replaceChildren();names[lang].forEach((name,i)=>{const label=document.createElement('label');label.textContent=name;const select=document.createElement('select');select.setAttribute('aria-label',name);L.states.forEach((text,v)=>{let option=document.createElement('option');option.value=String(v);option.textContent=text;select.append(option)});select.value=String(states[i]);select.addEventListener('change',()=>{states[i]=Number(select.value);applyShapes()});label.append(select);$('state-controls').append(label)});applyShapes();$('next-choices').replaceChildren();names[lang].forEach((name,i)=>{const label=document.createElement('label');label.className='next-choice';const r=document.createElement('input');r.type='radio';r.name='priority';r.value=String(i);r.checked=chosenArea===i;r.addEventListener('change',()=>{chosenArea=i;updateSuggestion()});const span=document.createElement('span');const strong=document.createElement('strong');strong.textContent=name+' — ';span.append(strong,document.createTextNode(L.actions[i]));label.append(r,span);$('next-choices').append(label)});txt('suggestion-title',L.suggestionTitle);txt('suggestion-hint',L.suggestionHint);$('prompts').replaceChildren();const label=document.createElement('label');label.textContent=L.actionPrompt;const area=document.createElement('textarea');area.value=actionNote;area.rows=2;area.placeholder=L.actionPlaceholder;area.addEventListener('input',()=>actionNote=area.value);label.append(area);$('prompts').append(label);const note=document.createElement('p');note.className='after-action';note.textContent=L.afterAction;$('prompts').append(note);updateSuggestion()}
function updateSuggestion(){const L=DATA[lang];$('suggestion-panel').classList.toggle('hidden',chosenArea===null);if(chosenArea!==null){txt('suggestion-text',L.suggestions[chosenArea]);}}
function applyShapes(){states.forEach((v,i)=>{$('shape-'+i).setAttribute('opacity',[.38,1,.17][v])})}
$('en-btn').addEventListener('click',()=>{lang='en';render()});$('zh-btn').addEventListener('click',()=>{lang='zh';render()});$('prev').addEventListener('click',()=>{if(step>0){step--;render();$('questions-panel').scrollIntoView({block:'start'})}});$('next').addEventListener('click',()=>{if(step<5){step++;render();(step===5?$('reflection-panel'):$('questions-panel')).scrollIntoView({block:'start'})}});$('review').addEventListener('click',()=>{step=4;render();$('questions-panel').scrollIntoView({block:'start'})});$('restart').addEventListener('click',()=>{step=0;answers=[null,null,null,null,null];states=[0,0,0,0,0];chosenArea=null;actionNote='';render();window.scrollTo({top:0,behavior:'instant'})});render();})();
</script></body></html>
