t:space-between;gap:15px;color:var(--muted);font-size:13px;font-weight:600}.track{height:7px;background:var(--soft);border-radius:20px;overflow:hidden;margin:13px 0 30px}.fill{height:100%;width:0;background:var(--green);transition:width .2s}.question-tag{font-size:12px;letter-spacing:1.1px;color:var(--green);font-weight:700;text-transform:uppercase}.situation{white-space:pre-line;margin:16px 0 20px;max-width:730px}.ask{font-weight:700;color:var(--navy);margin:0 0 16px}.options{display:grid;gap:11px}.option{display:flex;text-align:left;gap:14px;align-items:flex-start;border:1px solid #d7e2df;background:white;border-radius:7px;padding:15px 17px;color:var(--ink);width:100%;transition:border-color .12s,background .12s}.option:hover:not(:disabled){border-color:var(--green);background:#f7faf8}.letter{width:27px;height:27px;flex-shrink:0;display:grid;place-items:center;border:1px solid #d0dbd9;border-radius:50%;color:var(--navy);font-weight:700;font-size:12px}.option.selected{border:2px solid var(--navy);padding:14px 16px;background:#f6f8f9}.option.correct{border-color:#54766d;background:#f1f6f3}.feedback{margin-top:24px;padding:20px 22px;background:var(--soft);border-left:4px solid var(--green);border-radius:3px}.feedback.wrong{border-left-color:#a77a47;background:#fbf7f0}.feedback h3{font-family:inherit;font-size:17px;font-weight:700;margin:0 0 6px}.feedback p{margin:0}.feedback small{display:block;margin-top:10px;color:var(--muted)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:27px;align-items:center}.btn{border:1px solid #c5d5d0;background:white;color:var(--navy);border-radius:5px;padding:11px 21px;font-size:14px;font-weight:650}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--green);border-color:var(--green)}.btn:hover{background:var(--soft)}.quiet{font-size:13px;color:var(--muted)}.completion p{max-width:740px}.takeaway{background:var(--soft);padding:18px 22px;border-left:3px solid var(--green);margin-top:24px}.takeaway p{margin:7px 0}.reflection{margin-top:23px}.reflection label{font-weight:650;display:block;margin-bottom:9px;color:var(--navy)}textarea{width:100%;min-height:100px;padding:13px;border:1px solid #c5d4d0;border-radius:6px;resize:vertical;color:var(--ink);background:white}footer{background:var(--navy-dark);color:#d5e0e5;padding:25px 0;font-size:12px}.hidden{display:none!important}@media(max-width:600px){.masthead-in{align-items:flex-start;flex-direction:column;padding:14px 0;gap:6px}.hero{padding:32px 0}.panel{padding:19px}.option{padding:13px}.option.selected{padding:12px}h2{font-size:25px}.btn{flex:1 1 130px}}

.focus-label{font-size:12px;letter-spacing:1px;color:var(--green);text-transform:uppercase;font-weight:700;margin:6px 0 10px}.question-remember{margin-top:16px;border-left:3px solid var(--green);padding:12px 16px;background:#f4f7f6;font-size:14px}.editorial{margin-top:14px;padding:10px 13px;background:#fff9e9;border:1px solid #d8b975;border-radius:5px;font-size:13px;color:#705a31}.status-text{font-size:13px;color:var(--muted)}.option:focus-visible{outline:3px solid var(--green);outline-offset:2px}a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.hero .book-link{margin-top:12px}</style></head>

<script>const QUESTIONS=[{"title":["Understanding Your Own Work","这份作业，你真的理解了吗？"],"focus":["Understanding","理解（Understanding）"],"s":["You have used AI to help you develop and refine an assignment.\n\nThe writing looks good, and you understand most of it. However, when a friend asks you to explain the main argument without looking at the document, you find it difficult.","你使用 AI 帮助构思和修改了一份作业（Assignment）。\n\n文章看起来不错，大部分内容你也觉得自己理解了。\n\n但是，当朋友让你不看文稿、用自己的话解释文章的主要论点时，你却发现自己说不太清楚。"],"ask":["What can you learn from this experience?","从这次经历中，你可以学到什么？"],"options":[["If the writing is clear, being able to explain it independently is less important.","只要文章写得清楚，能不能独立解释其中的论点并不那么重要。"],["Struggling to explain the argument means that the assignment is not genuinely yours.","如果连自己的论点都解释不清楚，就说明这份作业并不真正属于自己。"],["Explaining the main argument in your own words can help you recognise and strengthen your understanding.","试着用自己的话解释主要论点，可以帮助自己发现哪些地方已经理解，哪些地方还需要进一步学习。"],["Memorising the argument is the best way to demonstrate that you understand it.","把文章的主要论点背熟，是证明自己理解了内容的最好方法。"]],"correct":2,"feedback":[["Clear writing is valuable, but it does not always reflect how well you understand the ideas. Try summarising the central argument in your own words to see what you have grasped.","文章表达清楚固然重要，但这不一定代表你真正理解了其中的内容。试着不用看文稿，用自己的话概括主要论点，看看自己到底理解了多少。"],["Finding an explanation difficult does not mean the assignment is not yours. Understanding develops through learning, and difficulty can help you recognise what you may want to revisit.","暂时解释不清楚，并不意味着这份作业就不属于你。理解需要时间，也需要不断学习。遇到困难，可以帮助你发现哪些地方还需要进一步弄明白。"],["Recommended. Explaining an argument in your own words can reveal what you understand and where the connections are still unclear. This is one way to develop a stronger understanding of your work.","推荐。试着用自己的话解释论点，可以检验你是否真正理解了文章的内容，以及不同观点之间的联系。如果有些地方说不清楚，就说明这些地方值得再深入思考。"],["Memorising may help you recall information, but understanding involves making sense of how ideas connect and why they matter. Try explaining the argument in a different way or using your own example.","背诵可以帮助记忆，但记住一段话不等于理解它。真正的理解，还包括知道不同观点之间有什么联系、为什么重要。试着换一种说法，或者用自己的例子来解释。"]],"remember":["Making work your own involves developing an understanding of the thinking behind it, not simply recognising the words on the page.","真正掌握一份作业，不只是熟悉文章写了什么，更重要的是理解这些内容背后的思考和推理。"],"provisional":false},{"title":["Understanding Is Not the Same as Judgement","理解论点，就代表你会判断了吗？"],"focus":["Judgement","判断（Judgement）"],"s":["You can explain the main argument of your assignment and understand the conclusion.\n\nAI helped you develop the argument and suggested evidence to support it.\n\nWhen you look back, however, you realise that you have not considered why this evidence is more convincing than other possible explanations.","你能够解释作业的主要论点，也理解文章的结论。\n\n在完成作业时，AI 帮助你发展了论证，并推荐了一些支持论点的证据。\n\n但是，重新检查作业时，你发现自己还没有认真思考：为什么这些证据能够支持你的结论？有没有其他可能的解释？"],"ask":["What would help you develop greater ownership of your argument?","怎样才能更好地掌握自己的论证？"],"options":[["Being able to explain the argument is sufficient because you understand what it says.","只要能解释清楚论点，就说明自己已经充分理解了，没有必要再进一步分析。"],["Asking AI to confirm that the conclusion is supported by the evidence.","请 AI 再检查一次，确认这些证据是否足以支持结论。"],["Examining the evidence, considering alternative explanations and developing your own reasons for the conclusion.","认真检查证据，考虑其他可能的解释，并形成自己支持这一结论的理由。"],["Including more academic references to make the argument stronger.","增加更多学术文献引用，让自己的论证看起来更有说服力。"]],"correct":2,"feedback":[["Understanding an argument is an important starting point. Judgement takes you further by considering why the argument is convincing, what supports it and where its limitations may lie.","能解释论点是一个重要的起点。但判断还需要更进一步：这个论点为什么可信？有哪些证据支持？又存在哪些局限？"],["AI can help you explore possible explanations, but its agreement does not establish that an argument is well supported. Consider what evidence would justify the conclusion.","AI 可以帮助你探索不同解释，但 AI 说结论合理，并不意味着它一定有充分的证据支持。你还需要自己检查证据，并思考这些证据究竟能够说明什么。"],["Recommended. Ownership develops when you examine the reasoning and evidence, rather than simply accept a conclusion. Comparing explanations can help you develop a position you can justify.","推荐。真正掌握自己的论证，不只是接受一个看起来合理的结论，而是能够检查证据、比较不同解释，并说明自己为什么支持这一结论。"],["Additional references may be useful, but more sources do not automatically produce stronger reasoning. Consider how each source contributes to your argument and what it actually establishes.","更多文献不一定意味着更有说服力。关键不在于引用了多少篇，而在于这些文献是否相关、能够支持什么，以及你如何运用它们来发展自己的论证。"]],"remember":["Understanding an argument helps you explain what it says. Judgement helps you explain why you support it.","理解，是能够解释一个论点在说什么；判断，是能够说明你为什么支持这个论点。"],"provisional":false},{"title":["Who Is Directing Your Work?","谁在决定你的作业方向？"],"focus":["Agency","主动选择与决策（Agency）"],"s":["While developing an assignment, you use AI to explore possible approaches.\n\nAI suggests a structure, several arguments and a conclusion. You find these suggestions useful and follow most of them.\n\nLater, you realise that you have not considered many alternative ways of approaching the task.","完成作业时，你使用 AI 来探索不同的写作思路。\n\nAI 为你建议了文章结构、几个主要论点，以及一个可能的结论。\n\n你觉得这些建议不错，于是采用了其中的大部分。\n\n但后来你意识到，自己似乎没有认真考虑过其他可能的写法。"],"ask":["What does this experience suggest about developing ownership?","从这次经历中，你可以怎样更主动地掌握自己的学习？"],"options":[["Following AI's suggestions is sufficient if the assignment meets the marking criteria.","只要最终作业符合评分标准（Marking Criteria），按照 AI 的建议完成就没有问题。"],["Choosing which AI suggestions to include always means you have directed the work yourself.","既然是自己决定采用哪些 AI 建议，就说明整个作业过程是由自己主导的。"],["To maintain independence, students should avoid asking AI for suggestions.","为了保持独立思考，最好不要向 AI 寻求建议。"],["AI suggestions can support your work, but you also need to consider and make meaningful decisions about its direction.","AI 可以提供有用的建议，但你仍然需要认真考虑不同的选择，并对作业的发展方向作出自己的决定。"]],"correct":3,"feedback":[["Meeting the marking criteria matters, but it does not tell the whole story of how the work developed. Consider how you arrived at your approach and whether you had reasons for choosing it.","符合评分标准很重要，但这并不能说明你是否真正参与了作业的思考和决策过程。你还需要问问自己：为什么选择这种写法？有没有其他更合适的方法？"],["Selecting suggestions is a form of decision-making. However, directing your work also involves considering what you want to achieve, exploring alternatives and deciding which approach is appropriate.","选择采用哪些建议，确实也是一种决策。但真正主导自己的学习，还包括明确想达到什么目标、考虑不同的方法，并判断哪种方法更适合当前任务。"],["Using AI does not necessarily reduce independence. AI can help you explore possibilities while you retain responsibility for deciding how to proceed.","使用 AI 并不一定会削弱独立思考。AI 可以帮助你发现新的思路和可能性。重要的是，你是否认真考虑这些建议，并自己决定下一步怎么做。"],["Recommended. Agency involves taking an active role in shaping your work. You can learn from AI suggestions while deciding which ideas to develop, adapt or leave aside, and why.","推荐。主动学习意味着你不仅接受建议，还会参与决定作业如何发展。你可以借助 AI 探索思路，但哪些观点值得保留、哪些需要修改、哪些应该放弃，以及为什么这样决定，都需要你认真思考。"]],"remember":["AI can suggest a direction, but developing ownership involves making meaningful decisions about the direction you take.","AI 可以帮你提出思路，但最终走哪条路、为什么这样选择，需要你自己参与判断和决定。"],"provisional":false},{"title":["Taking Responsibility for Your Work","你能为自己的作业负责吗？"],"focus":["Responsibility","责任（Responsibility）"],"s":["You have developed an assignment with permitted AI assistance and are reviewing the completed work.\n\nYou notice that one of your conclusions may be too broad and that some important limitations have not been discussed.\n\nYou are reasonably confident in your overall argument, but you recognise these weaknesses.","你在学校允许的范围内使用 AI，完成了一份作业，现在正在进行最后检查。\n\n你发现文章中的一个结论可能说得太绝对，而且没有讨论一些重要的局限。\n\n虽然你对整体论证比较有信心，但也意识到了这些问题。"],"ask":["What does taking responsibility for your work involve?","对自己的作业负责，意味着什么？"],"options":[["Defending the original conclusion because it reflects the work you have already completed.","坚持原来的结论，因为它代表了自己已经完成的工作。"],["Recognising the limitations, considering whether changes are needed and being able to explain your conclusion.","认识到结论的局限，考虑是否需要修改，并能够解释自己为什么得出这样的结论。"],["Asking AI to make the conclusion more convincing without changing its meaning.","请 AI 在不改变原意的情况下，把结论修改得更有说服力。"],["Removing the conclusion because any uncertainty makes it unreliable.","删除这个结论，因为只要存在不确定性，结论就不够可靠。"]],"correct":1,"feedback":[["Standing behind your work does not mean defending every claim regardless of its limitations. Responsibility includes being open to reconsidering your conclusions when there are good reasons to do so.","对自己的作业负责，并不意味着必须坚持每一个原有观点。如果发现结论存在问题，有充分理由时就应该重新考虑，必要时作出修改。"],["Recommended. Taking responsibility involves recognising strengths and limitations, making justified revisions where needed and being prepared to explain your reasoning. It does not require having a perfect answer to every possible question.","推荐。对作业负责，包括认识到论证的优点和不足，在必要时作出有理由的修改，并能够解释自己的思考过程。这并不意味着你必须对所有问题都有完美的答案。"],["Improving expression may help communicate an argument, but it does not resolve weaknesses in its reasoning. First consider what the evidence allows you to conclude.","改进语言表达可以让结论更清楚，但不能解决论证本身的问题。首先需要检查证据究竟能够支持什么结论，再决定应该怎样表达。"],["Uncertainty does not necessarily make a conclusion unacceptable. Academic arguments often have limitations. The important question is whether your conclusion is reasonable and appropriately qualified.","学术研究中的结论往往存在一定的局限和不确定性。这并不意味着结论就没有价值。关键是结论是否有合理依据，以及是否清楚说明了它适用的范围和局限。"]],"remember":["Standing behind your work does not mean claiming it is perfect. It means taking responsibility for the reasoning, conclusions and limitations you present.","对自己的作业负责，不是说它完美无缺，而是能够解释自己的推理和结论，认识到其中的不足，并在必要时作出修改。"],"provisional":false},{"title":["Does Following the Rules Mean Ownership?","遵守 AI 使用规定，就代表真正掌握了作业吗？"],"focus":["Academic Integrity and Intellectual Ownership","学术诚信（Academic Integrity）与 Ownership"],"s":["Your university permits certain forms of AI assistance, and you have followed the requirements and declared your AI use appropriately.\n\nAI has helped you considerably with developing arguments and organising the assignment.\n\nYou now wonder whether following the rules means you have also made the work intellectually your own.","学校允许学生在一定范围内使用 AI。你遵守了相关要求，也按照规定申报了 AI 的使用情况。\n\n在完成作业的过程中，AI 帮助你发展了不少论点，也协助组织了文章结构。\n\n现在你开始思考：既然自己已经遵守了所有规定，是不是就代表自己真正掌握了这份作业？"],"ask":["Which statement best explains the relationship between academic integrity and ownership?","以下哪种说法最能解释学术诚信与真正掌握作业之间的关系？"],"options":[["Following the AI rules establishes ownership because the assistance is permitted.","只要 AI 的使用符合学校规定，就说明这份作业真正属于自己。"],["A high mark establishes ownership because it shows that the completed work is strong.","如果作业获得高分，就说明自己已经真正掌握了其中的内容。"],["Academic integrity and ownership are related but different: following the rules matters, while ownership also develops through understanding, judgement, agency and responsibility.","学术诚信和真正掌握作业既有联系，也有区别。遵守规定很重要，但真正掌握作业，还需要理解、判断、主动决策和承担责任。"],["Genuine ownership requires completing the assignment without any AI assistance.","只有完全不使用 AI，独立完成所有内容，才能算真正掌握了自己的作业。"]],"correct":2,"feedback":[["Following the rules is essential, but it does not automatically tell you how much you have understood or contributed intellectually. Consider the thinking and decisions you brought to the work.","遵守学校规定是基本要求，但这并不能直接说明你理解了多少内容，或者在思考和决策过程中发挥了多大作用。你还需要回顾自己是如何参与完成这份作业的。"],["A high mark can recognise the quality of a submission, but it does not necessarily tell us how the student developed their understanding or made decisions during the process.","高分可以反映作业的质量，但不能完全说明你是如何学习的、如何发展自己的理解，以及如何作出重要决定。"],["Recommended. Academic integrity concerns meeting the assessment requirements. Intellectual ownership concerns how you engage with the thinking behind your work. Both matter, but one does not automatically establish the other.","推荐。学术诚信（Academic Integrity）强调遵守学校的考核要求和相关规定；Ownership 则关注你是否真正参与了作业背后的思考、判断和决策。两者都重要，但不能相互替代。"],["Appropriate assistance does not necessarily prevent students from making work intellectually their own. What matters is how they use the support and engage with the learning and decisions involved.","在学校允许的范围内使用 AI，并不一定妨碍你真正掌握作业。重要的是，你如何利用这些帮助，以及是否积极参与了理解、思考和决策的过程。"]],"remember":["Following the rules is essential. Making the learning your own involves something more.","遵守学术规定是基本要求。但要真正掌握自己的学习成果，还需要在理解、判断、决策和承担责任方面付出努力。"],"provisional":false},{"title":["What Does Making Your Work Your Own Look Like?","怎样才能真正掌握自己的学习成果？"],"focus":["Bringing Ownership Together","综合运用 Ownership"],"s":["Four students describe their experiences of completing an assignment. All have followed the assessment requirements, including any rules on AI assistance.","四名学生分享了自己完成作业的经历。\n\n他们都遵守了学校的作业要求，包括 AI 使用规定。"],"ask":["Which experience best illustrates the different ways a student can develop intellectual ownership?","以下哪位学生的经历，最能体现如何在学习中逐渐建立 Ownership？"],"options":[["Student A worked independently and spent considerable time researching and writing. They are confident because they produced everything themselves.","学生 A 独立完成了大量研究和写作。因为所有内容都是自己完成的，所以他对作业很有信心。"],["Student B used permitted AI assistance to help develop the assignment. They worked through the main ideas, questioned suggestions, made important decisions and can explain the reasoning and limitations of the completed work.","学生 B 在学校允许的范围内使用 AI。他认真理解主要观点，对 AI 的建议提出质疑，自己作出重要决定，并能够解释最终论证的理由和局限。"],["Student C used AI to improve their writing and achieved a good mark. They believe this demonstrates that they have successfully made the work their own.","学生 C 使用 AI 改进了写作，并获得了不错的成绩。因此，他认为自己已经真正掌握了这份作业。"],["Student D followed the assignment guidance carefully and checked that the completed work met every marking criterion.","学生 D 仔细阅读了作业要求，并逐项检查最终作品是否符合所有评分标准。"]],"correct":1,"feedback":[["Working independently and investing effort can contribute greatly to ownership. It is also worth considering how the student developed their understanding, evaluated evidence and justified their conclusions.","独立完成作业，并投入大量时间和精力，能够帮助学生更好地掌握学习成果。但还需要考虑：他是否真正理解了相关内容？有没有认真评价证据？能否解释自己的结论？"],["Recommended. This experience brings several aspects of ownership together. The student engages with the ideas, exercises judgement, makes meaningful decisions and takes responsibility for the work. These practices help develop intellectual ownership, whether or not AI provides permitted assistance.","推荐。这位学生不仅理解了作业内容，还主动判断、作出决定，并对最终作品负责。这些都是发展 Ownership 的重要表现。无论是否使用学校允许的 AI 协助，这些学习过程都很重要。"],["A good result is valuable, but marks alone do not reveal the learning process. Consider what understanding, judgement and abilities the student developed while completing the assignment.","获得好成绩值得肯定，但成绩本身并不能说明整个学习过程。更值得思考的是：在完成作业的过程中，他理解了什么、学会了什么，又发展了哪些能力？"],["Understanding and meeting assessment requirements are important academic practices. Ownership also involves the student's engagement with the ideas, reasoning and decisions behind the completed work.","理解并遵守作业要求，是重要的学术学习能力。但真正掌握作业，还包括积极参与其中的思考、推理和决策，而不仅仅是完成评分标准所要求的内容。"]],"remember":["Making work your own is not one action or a final declaration. It develops through how you understand, judge, decide and take responsibility as you learn.","真正掌握自己的学习成果，不是完成某一个步骤，也不是说一句“这是我自己的作品”。它需要通过不断理解、判断、作出决定和承担责任，在学习过程中逐渐建立。"],"provisional":false}];

K》第七章。","actionPrompt":"可选：写下一个你已经能够解释清楚，或者还想进一步理解的地方。","placeholder":"我已经能够解释，或者还想进一步弄明白的是……","privacy":"你的回答只会显示在当前浏览器页面，不会上传或评分。刷新页面后，内容可能丢失。","restart":"重新开始","copy":"复制我的反思","back":"返回 Learning with AI","footer":"Studying in the UK · Learning with AI · Ownership Check","copied":"已复制","quality":"Quality Check · 质量检查","boundary":"Boundary Check · 边界检查","ownership":"Ownership Check · 我的作业，我真的掌握了吗？","bookChapter":"第七章 · Learning in the AI Era: Boundaries, Judgement, and Ownership"}};
let lang='en',index=0;
let answers=Array(QUESTIONS.length).fill(null),revealed=Array(QUESTIONS.length).fill(false),solved=Array(QUESTIONS.length).fill(false);
const $=id=>document.getElementById(id), t=k=>COPY[lang][k], li=()=>lang==='en'?0:1;
function staticText(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});document.querySelectorAll('[data-i-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.iPlaceholder)});$('en').setAttribute('aria-pressed',String(lang==='en'));$('zh').setAttribute('aria-pressed',String(lang==='zh'));}
function render(){staticText();const q=QUESTIONS[index],count=solved.filter(Boolean).length;
$('progresslabel').textContent=t('progress').replace('{n}',index+1);$('countlabel').textContent=t('count').replace('{n}',count);$('fill').style.width=(count/QUESTIONS.length*100)+'%';$('progress').setAttribute('aria-valuenow',count);$('focus').textContent=q.focus[li()];$('qtitle').textContent=q.title[li()];$('situation').textContent=q.s[li()];$('ask').textContent=q.ask[li()];
$('options').replaceChildren();q.options.forEach((op,i)=>{let b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('aria-pressed',String(answers[index]===i));if(answers[index]===i)b.classList.add('selected');if(answers[index]===i&&i===q.correct)b.classList.add('correct');let letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];let content=document.createElement('span');content.textContent=op[li()];b.append(letter,content);b.addEventListener('click',()=>pick(i));$('options').append(b)});
$('feedback').classList.toggle('hidden',!revealed[index]);$('rememberBox').classList.toggle('hidden',!revealed[index]);$('rememberText').textContent=q.remember[li()];
if(revealed[index]){$('feedback').classList.toggle('wrong',answers[index]!==q.correct);$('feedbacktitle').textContent=answers[index]===q.correct?t('correct'):t('wrong');$('feedbackbody').textContent=q.feedback[answers[index]][li()];$('feedbackhint').textContent=answers[index]===q.correct?'':t('hint')}
$('prev').textContent=t('prev');$('prev').disabled=index===0;$('again').hidden=!revealed[index]||answers[index]===q.correct;$('again').textContent=t('again');$('next').textContent=index===QUESTIONS.length-1?t('finish'):t('next');$('next').disabled=!revealed[index]}
function pick(i){answers[index]=i;revealed[index]=true;if(i===QUESTIONS[index].correct)solved[index]=true;render();$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});}
function showFinish(){staticText();$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('finish').focus();window.scrollTo({top:0,behavior:'smooth'})}
$('prev').onclick=()=>{if(index>0){index--;render()}};
$('next').onclick=()=>{if(index<QUESTIONS.length-1){index++;render();$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}else showFinish()};
$('again').onclick=()=>{answers[index]=null;revealed[index]=false;render()};
$('en').onclick=()=>{lang='en';$('finish').classList.contains('hidden')?render():staticText()};
$('zh').onclick=()=>{lang='zh';$('finish').classList.contains('hidden')?render():staticText()};
$('restart').onclick=()=>{index=0;answers.fill(null);revealed.fill(false);solved.fill(false);$('nextaction').value='';$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');render();$('quiz').scrollIntoView({behavior:'smooth'})};
$('copy').onclick=async()=>{const v=$('nextaction').value.trim();if(!v){$('nextaction').focus();return}try{await navigator.clipboard.writeText(v);$('copy').textContent=t('copied')}catch(e){$('nextaction').select();document.execCommand('copy');$('copy').textContent=t('copied')}};
render();</script></body></html>
