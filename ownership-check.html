:root{--navy:#20384e;--navy-dark:#162d42;--green:#54766d;--ink:#34495b;--muted:#60717d;--background:#f8f9f7;--white:#fff;--line:#dfe7e6;--soft:#eef3f1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--background);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;line-height:1.65}button,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}:focus-visible{outline:3px solid var(--green);outline-offset:3px}.container{width:min(920px,91%);margin:auto}.masthead{background:#fff;border-bottom:1px solid var(--line)}.masthead-in{display:flex;justify-content:space-between;gap:15px;align-items:center;min-height:75px}.brand{text-decoration:none;font-family:Georgia,serif;font-weight:bold;font-size:20px;color:var(--navy)}.topright{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.crumb{color:var(--muted);font-size:13px}.switcher{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.switcher button{border:0;background:#fff;color:var(--navy);padding:7px 11px;font-size:13px;font-weight:600}.switcher button[aria-pressed=true]{background:var(--navy);color:white}.hero{background:linear-gradient(125deg,#fff,#eef3f1);padding:48px 0 38px}.eyebrow{font-size:12px;color:var(--green);font-weight:750;letter-spacing:1.7px;text-transform:uppercase}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-weight:normal;line-height:1.25}h1{font-size:clamp(36px,6vw,56px);margin:12px 0 16px}h2{font-size:29px;margin:6px 0 14px}.hero p{max-width:760px;font-size:17px;color:var(--muted);margin:0 0 13px}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.chip{border:1px solid #d4dfdc;padding:5px 11px;border-radius:20px;font-size:12px;color:var(--green);background:white}.main{padding:32px 0 60px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:clamp(20px,5vw,39px);box-shadow:0 5px 20px rgba(25,55,65,.035)}.progressrow{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:13px;font-weight:600}.track{height:7px;background:var(--soft);border-radius:20px;overflow:hidden;margin:13px 0 30px}.fill{height:100%;width:0;background:var(--green);transition:width .2s}.question-tag{font-size:12px;letter-spacing:1.1px;color:var(--green);font-weight:700;text-transform:uppercase}.situation{white-space:pre-line;margin:16px 0 20px;max-width:730px}.ask{font-weight:700;color:var(--navy);margin:0 0 16px}.options{display:grid;gap:11px}.option{display:flex;text-align:left;gap:14px;align-items:flex-start;border:1px solid #d7e2df;background:white;border-radius:7px;padding:15px 17px;color:var(--ink);width:100%;transition:border-color .12s,background .12s}.option:hover:not(:disabled){border-color:var(--green);background:#f7faf8}.letter{width:27px;height:27px;flex-shrink:0;display:grid;place-items:center;border:1px solid #d0dbd9;border-radius:50%;color:var(--navy);font-weight:700;font-size:12px}.option.selected{border:2px solid var(--navy);padding:14px 16px;background:#f6f8f9}.option.correct{border-color:#54766d;background:#f1f6f3}.feedback{margin-top:24px;padding:20px 22px;background:var(--soft);border-left:4px solid var(--green);border-radius:3px}.feedback.wrong{border-left-color:#a77a47;background:#fbf7f0}.feedback h3{font-family:inherit;font-size:17px;font-weight:700;margin:0 0 6px}.feedback p{margin:0}.feedback small{display:block;margin-top:10px;color:var(--muted)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:27px;align-items:center}.btn{border:1px solid #c5d5d0;background:white;color:var(--navy);border-radius:5px;padding:11px 21px;font-size:14px;font-weight:650}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--green);border-color:var(--green)}.btn:hover{background:var(--soft)}.quiet{font-size:13px;color:var(--muted)}.completion p{max-width:740px}.takeaway{background:var(--soft);padding:18px 22px;border-left:3px solid var(--green);margin-top:24px}.takeaway p{margin:7px 0}.reflection{margin-top:23px}.reflection label{font-weight:650;display:block;margin-bottom:9px;color:var(--navy)}textarea{width:100%;min-height:100px;padding:13px;border:1px solid #c5d4d0;border-radius:6px;resize:vertical;color:var(--ink);background:white}footer{background:var(--navy-dark);color:#d5e0e5;padding:25px 0;font-size:12px}.hidden{display:none!important}@media(max-width:600px){.masthead-in{align-items:flex-start;flex-direction:column;padding:14px 0;gap:6px}.hero{padding:32px 0}.panel{padding:19px}.option{padding:13px}.option.selected{padding:12px}h2{font-size:25px}.btn{flex:1 1 130px}}

<script>const QUESTIONS=[{"title":["Understanding Your Own Work","理解自己的作品"],"focus":["Understanding","理解"],"s":["You have used AI to help you develop and refine an assignment.\n\nThe writing looks good, and you understand most of it. However, when a friend asks you to explain the main argument without looking at the document, you find it difficult.","你曾使用 AI 帮助发展和修改一份作业。\n\n文章看起来不错，你也理解大部分内容。但当朋友请你不看文稿解释主要论点时，你发现自己很难说清楚。"],"ask":["What can you learn from this experience?","你能从这次经历中学到什么？"],"options":[["If the writing is clear, being able to explain it independently is less important.","如果文章表达清晰，能否独立解释就不那么重要。"],["Struggling to explain the argument means that the assignment is not genuinely yours.","难以解释论点意味着作业并不真正属于自己。"],["Explaining the main argument in your own words can help you recognise and strengthen your understanding.","尝试用自己的话解释主要论点，有助于认识并加深自己的理解。"],["Memorising the argument is the best way to demonstrate that you understand it.","背熟论点是证明自己理解它的最佳方法。"]],"correct":2,"feedback":[["Clear writing is valuable, but it does not always reflect how well you understand the ideas. Try summarising the central argument in your own words to see what you have grasped.","写作清晰很重要，但不一定反映你对思想理解得有多深入。试着用自己的话概括核心论点，看看自己真正掌握了什么。"],["Finding an explanation difficult does not mean the assignment is not yours. Understanding develops through learning, and difficulty can help you recognise what you may want to revisit.","解释遇到困难，并不意味着作业不属于你。理解是在学习中逐渐发展的；困难可以帮助你发现需要重新探究的地方。"],["Recommended. Explaining an argument in your own words can reveal what you understand and where the connections are still unclear. This is one way to develop a stronger understanding of your work.","推荐。用自己的话解释论点，可以发现已经理解的内容，以及仍然模糊的联系。这是深化理解的一种方式。"],["Memorising may help you recall information, but understanding involves making sense of how ideas connect and why they matter. Try explaining the argument in a different way or using your own example.","背诵或许有助于记忆，但理解意味着弄清思想如何联系、为什么重要。试着换一种说法或用自己的例子说明。"]],"remember":["Making work your own involves developing an understanding of the thinking behind it, not simply recognising the words on the page.","让作品真正成为自己的，意味着理解其中的思考，而不只是认得纸面上的文字。"],"provisional":false},{"title":["Understanding Is Not the Same as Judgement","理解不等于判断"],"focus":["Judgement","判断"],"s":["You can explain the main argument of your assignment and understand the conclusion.\n\nAI helped you develop the argument and suggested evidence to support it.\n\nWhen you look back, however, you realise that you have not considered why this evidence is more convincing than other possible explanations.","你可以解释作业的主要论点，也理解结论。\n\nAI 帮助你发展了论证，并建议了支持论点的证据。\n\n但回头检查时，你意识到自己尚未考虑为什么这些证据比其他可能的解释更有说服力。"],"ask":["What would help you develop greater ownership of your argument?","什么能帮助你对论证形成更强的自主把握？"],"options":[["Being able to explain the argument is sufficient because you understand what it says.","能够解释论点就足够了，因为你已经知道它在说什么。"],["Asking AI to confirm that the conclusion is supported by the evidence.","请 AI 确认结论是否得到证据支持。"],["Examining the evidence, considering alternative explanations and developing your own reasons for the conclusion.","审视证据、考虑其他解释，并形成自己支持结论的理由。"],["Including more academic references to make the argument stronger.","增加学术文献引用，使论证更有力度。"]],"correct":2,"feedback":[["Understanding an argument is an important starting point. Judgement takes you further by considering why the argument is convincing, what supports it and where its limitations may lie.","理解论点是重要起点。判断还要求进一步思考它为何可信、有什么依据，以及存在哪些局限。"],["AI can help you explore possible explanations, but its agreement does not establish that an argument is well supported. Consider what evidence would justify the conclusion.","AI 可以帮助探索可能的解释，但 AI 的赞同不能证明论点得到充分支持。你需要考虑什么证据能支持结论。"],["Recommended. Ownership develops when you examine the reasoning and evidence, rather than simply accept a conclusion. Comparing explanations can help you develop a position you can justify.","推荐。自主把握来自审视推理和证据，而非照单接受结论。比较不同解释有助于形成能够说明理由的立场。"],["Additional references may be useful, but more sources do not automatically produce stronger reasoning. Consider how each source contributes to your argument and what it actually establishes.","额外的文献可能有用，但数量更多并不自动意味着推理更强。应思考每个来源如何支持论点，以及它真正证明了什么。"]],"remember":["Understanding an argument helps you explain what it says. Judgement helps you explain why you support it.","理解帮助你解释论点说了什么；判断帮助你解释为什么支持它。"],"provisional":false},{"title":["Who Is Directing Your Work?","是谁在决定你的工作方向？"],"focus":["Agency","能动性"],"s":["While developing an assignment, you use AI to explore possible approaches.\n\nAI suggests a structure, several arguments and a conclusion. You find these suggestions useful and follow most of them.\n\nLater, you realise that you have not considered many alternative ways of approaching the task.","完成作业时，你用 AI 探索可能的方法。\n\nAI 建议了结构、几个论点和一个结论。你觉得有用，于是采纳了大部分建议。\n\n后来你发现，自己没有认真考虑其他可能的做法。"],"ask":["What does this experience suggest about developing ownership?","这段经历说明了怎样发展对作品的自主把握？"],"options":[["Following AI's suggestions is sufficient if the assignment meets the marking criteria.","只要作业符合评分标准，照着 AI 的建议做就足够了。"],["Choosing which AI suggestions to include always means you have directed the work yourself.","选择采用哪些 AI 建议，就始终意味着是自己主导了作品。"],["To maintain independence, students should avoid asking AI for suggestions.","为了保持独立，学生应避免向 AI 寻求建议。"],["AI suggestions can support your work, but you also need to consider and make meaningful decisions about its direction.","AI 的建议可以支持学习，但你仍需认真考虑并作出影响工作方向的决定。"]],"correct":3,"feedback":[["Meeting the marking criteria matters, but it does not tell the whole story of how the work developed. Consider how you arrived at your approach and whether you had reasons for choosing it.","符合评分标准很重要，但不足以说明作品是如何形成的。还要考虑自己为什么选择这条路径、理由是什么。"],["Selecting suggestions is a form of decision-making. However, directing your work also involves considering what you want to achieve, exploring alternatives and deciding which approach is appropriate.","挑选建议确实也是决策的一种，但主导工作还包括明确目标、探索其他可能性，并决定哪种方法合适。"],["Using AI does not necessarily reduce independence. AI can help you explore possibilities while you retain responsibility for deciding how to proceed.","使用 AI 不一定削弱独立性。它可以帮助探索可能性，而你仍负责决定如何继续。"],["Recommended. Agency involves taking an active role in shaping your work. You can learn from AI suggestions while deciding which ideas to develop, adapt or leave aside, and why.","推荐。能动性意味着主动塑造自己的工作。你可以从 AI 建议中学习，同时决定发展、调整或放弃哪些想法，并说明原因。"]],"remember":["AI can suggest a direction, but developing ownership involves making meaningful decisions about the direction you take.","AI 可以提出方向，但自主把握要求你对自己选择的方向作出有意义的决定。"],"provisional":false},{"title":["Taking Responsibility for Your Work","对自己的作品承担责任"],"focus":["Responsibility","责任"],"s":["You have developed an assignment with permitted AI assistance and are reviewing the completed work.\n\nYou notice that one of your conclusions may be too broad and that some important limitations have not been discussed.\n\nYou are reasonably confident in your overall argument, but you recognise these weaknesses.","你在获准使用 AI 协助的情况下完成作业，现在正审阅最终作品。\n\n你发现一个结论可能过于宽泛，而且没有讨论一些重要局限。\n\n你对整体论证有一定信心，但也看到了这些弱点。"],"ask":["What does taking responsibility for your work involve?","为自己的作品承担责任意味着什么？"],"options":[["Defending the original conclusion because it reflects the work you have already completed.","维护原有结论，因为它代表你已经完成的工作。"],["Recognising the limitations, considering whether changes are needed and being able to explain your conclusion.","承认局限、考虑是否需要修改，并能够解释自己的结论。"],["Asking AI to make the conclusion more convincing without changing its meaning.","请 AI 在不改变意思的前提下让结论更有说服力。"],["Removing the conclusion because any uncertainty makes it unreliable.","删除结论，因为存在任何不确定性就意味着不可靠。"]],"correct":1,"feedback":[["Standing behind your work does not mean defending every claim regardless of its limitations. Responsibility includes being open to reconsidering your conclusions when there are good reasons to do so.","为作品负责不等于不顾局限地捍卫每个主张。有充分理由时，责任也包括重新考虑结论。"],["Recommended. Taking responsibility involves recognising strengths and limitations, making justified revisions where needed and being prepared to explain your reasoning. It does not require having a perfect answer to every possible question.","推荐。承担责任包括认识优点和局限、在需要时作出有理由的修改，并准备解释自己的推理。并不要求能完美回答所有问题。"],["Improving expression may help communicate an argument, but it does not resolve weaknesses in its reasoning. First consider what the evidence allows you to conclude.","改善表达可以使论点更清楚，但不能解决推理上的弱点。首先要考虑证据能支持什么样的结论。"],["Uncertainty does not necessarily make a conclusion unacceptable. Academic arguments often have limitations. The important question is whether your conclusion is reasonable and appropriately qualified.","不确定性不一定使结论无法接受。学术论证往往有局限，关键是结论是否合理、限定是否恰当。"]],"remember":["Standing behind your work does not mean claiming it is perfect. It means taking responsibility for the reasoning, conclusions and limitations you present.","为作品负责不是声称它完美无缺，而是对所提出的推理、结论和局限负责。"],"provisional":false},{"title":["Does Following the Rules Mean Ownership?","遵守规则就意味着拥有作品吗？"],"focus":["Academic Integrity and Intellectual Ownership","学术诚信与智识所有权"],"s":["Your university permits certain forms of AI assistance, and you have followed the requirements and declared your AI use appropriately.\n\nAI has helped you considerably with developing arguments and organising the assignment.\n\nYou now wonder whether following the rules means you have also made the work intellectually your own.","学校允许某些形式的 AI 协助，你遵守了要求并恰当地申报了 AI 使用情况。\n\nAI 在发展论点和组织作业方面给予了大量帮助。\n\n现在你开始思考：遵守规则是否也意味着自己在智识层面真正掌握了作品？"],"ask":["Which statement best explains the relationship between academic integrity and ownership?","哪项陈述最能解释学术诚信与自主把握之间的关系？"],"options":[["Following the AI rules establishes ownership because the assistance is permitted.","只要 AI 协助是获准的，遵守规则就证明了自主把握。"],["A high mark establishes ownership because it shows that the completed work is strong.","高分证明了自主把握，因为它说明作品质量高。"],["Academic integrity and ownership are related but different: following the rules matters, while ownership also develops through understanding, judgement, agency and responsibility.","学术诚信与自主把握相关但不同：遵守规则很重要，而自主把握还通过理解、判断、能动性和责任发展。"],["Genuine ownership requires completing the assignment without any AI assistance.","真正的自主把握要求完全不用 AI 完成作业。"]],"correct":2,"feedback":[["Following the rules is essential, but it does not automatically tell you how much you have understood or contributed intellectually. Consider the thinking and decisions you brought to the work.","遵守规则必不可少，但并不自动说明你理解了多少、在智识上贡献了什么。要考虑自己在思考和决策中发挥的作用。"],["A high mark can recognise the quality of a submission, but it does not necessarily tell us how the student developed their understanding or made decisions during the process.","高分可以反映提交作品的质量，但不一定告诉我们学生如何发展理解、如何作出决定。"],["Recommended. Academic integrity concerns meeting the assessment requirements. Intellectual ownership concerns how you engage with the thinking behind your work. Both matter, but one does not automatically establish the other.","推荐。学术诚信关注是否符合考核要求；智识上的自主把握关注你如何参与作品背后的思考。两者都重要，但不能相互替代。"],["Appropriate assistance does not necessarily prevent students from making work intellectually their own. What matters is how they use the support and engage with the learning and decisions involved.","适当的协助不一定阻碍学生真正掌握作品。关键在于如何使用支持，以及如何参与学习和其中的决定。"]],"remember":["Following the rules is essential. Making the learning your own involves something more.","遵守规则必不可少；让学习真正成为自己的，还需要做得更多。"],"provisional":false},{"title":["What Does Making Your Work Your Own Look Like?","怎样才算让作品真正成为自己的？"],"focus":["Bringing Ownership Together","综合理解自主把握"],"s":["Four students describe their experiences of completing an assignment. All have followed the assessment requirements, including any rules on AI assistance.","四名学生描述了自己完成作业的经历。他们都遵守了考核要求，包括 AI 使用规定。"],"ask":["Which experience best illustrates the different ways a student can develop intellectual ownership?","哪种经历最能体现学生发展智识自主把握的不同方式？"],"options":[["Student A worked independently and spent considerable time researching and writing. They are confident because they produced everything themselves.","学生 A 独立完成了大量研究和写作，认为全部由自己完成，因此很有信心。"],["Student B used permitted AI assistance to help develop the assignment. They worked through the main ideas, questioned suggestions, made important decisions and can explain the reasoning and limitations of the completed work.","学生 B 在获准范围内使用 AI 支持作业。他们认真理解主要思想、质疑建议、作出重要决定，并能解释最终作品的推理与局限。"],["Student C used AI to improve their writing and achieved a good mark. They believe this demonstrates that they have successfully made the work their own.","学生 C 用 AI 改进写作并获得好成绩，认为这证明自己已经掌握了作品。"],["Student D followed the assignment guidance carefully and checked that the completed work met every marking criterion.","学生 D 仔细遵守作业指导，并检查最终作品是否符合每项评分标准。"]],"correct":1,"feedback":[["Working independently and investing effort can contribute greatly to ownership. It is also worth considering how the student developed their understanding, evaluated evidence and justified their conclusions.","独立完成并投入努力，可以大大促进自主把握。但还需考虑学生如何发展理解、评价证据和说明结论的理由。"],["Recommended. This experience brings several aspects of ownership together. The student engages with the ideas, exercises judgement, makes meaningful decisions and takes responsibility for the work. These practices help develop intellectual ownership, whether or not AI provides permitted assistance.","推荐。这种经历结合了自主把握的多个方面：参与思想、运用判断、作出有意义的决定，并对作品负责。无论是否获得获准的 AI 协助，这些实践都有助于发展自主把握。"],["A good result is valuable, but marks alone do not reveal the learning process. Consider what understanding, judgement and abilities the student developed while completing the assignment.","取得好成绩值得肯定，但成绩本身不能反映学习过程。应考虑学生发展了哪些理解、判断与能力。"],["Understanding and meeting assessment requirements are important academic practices. Ownership also involves the student's engagement with the ideas, reasoning and decisions behind the completed work.","理解并满足考核要求是重要的学术实践。自主把握还包括学生对作品背后的思想、推理和决定的参与。"]],"remember":["Making work your own is not one action or a final declaration. It develops through how you understand, judge, decide and take responsibility as you learn.","让作品成为自己的，不是一项动作，也不是最终的口头声明；它通过学习中理解、判断、决定和承担责任的方式逐渐发展。"],"provisional":false}];

let lang='en',index=0;
let answers=Array(QUESTIONS.length).fill(null),revealed=Array(QUESTIONS.length).fill(false),solved=Array(QUESTIONS.length).fill(false);
const $=id=>document.getElementById(id), t=k=>COPY[lang][k], li=()=>lang==='en'?0:1;
function staticText(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});document.querySelectorAll('[data-i-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.iPlaceholder)});$('en').setAttribute('aria-pressed',String(lang==='en'));$('zh').setAttribute('aria-pressed',String(lang==='zh'));}
function render(){staticText();const q=QUESTIONS[index],count=solved.filter(Boolean).length;
$('progresslabel').textContent=t('progress').replace('{n}',index+1);$('countlabel').textContent=t('count').replace('{n}',count);$('fill').style.width=(count/QUESTIONS.length*100)+'%';$('progress').setAttribute('aria-valuenow',count);$('focus').textContent=q.focus[li()];$('qtitle').textContent=q.title[li()];$('situation').textContent=q.s[li()];$('ask').textContent=q.ask[li()];
$('options').replaceChildren();q.options.forEach((op,i)=>{let b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('aria-pressed',String(answers[index]===i));if(answers[index]===i)b.classList.add('selected');if(answers[index]===i&&i===q.correct)b.classList.add('correct');let letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];let content=document.createElement('span');content.textContent=op[li()];b.append(letter,content);b.addEventListener('click',()=>pick(i));$('options').append(b)});
$('feedback').classList.toggle('hidden',!revealed[index]);$('rememberBox').classList.toggle('hidden',!revealed[index]);$('rememberText').textContent=q.remember[li()];
if(revealed[index]){$('feedback').classList.toggle('wrong',answers[index]!==q.correct);$('feedbacktitle').textContent=answers[index]===q.correct?t('correct'):t('wrong');$('feedbackbody').textContent=q.feedback[answers[index]][li()];$('feedbackhint').textContent=answers[index]===q.correct?'':t('hint')}
$('prev').textContent=t('prev');$('prev').disabled=index===0;$('again').hidden=!revealed[index]||answers[index]===q.correct;$('again').textContent=t('again');$('next').textContent=index===QUESTIONS.length-1?t('finish'):t('next');$('next').disabled=!revealed[index]}
function pick(i){answers[index]=i;revealed[index]=true;if(i===QUESTIONS[index].correct)solved[index]=true;render();$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});}
function showFinish(){staticText();$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('finish').focus();window.scrollTo({top:0,behavior:'smooth'})}
$('prev').onclick=()=>{if(index>0){index--;render()}};
$('next').onclick=()=>{if(index<QUESTIONS.length-1){index++;render();$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}else showFinish()};
$('again').onclick=()=>{answers[index]=null;revealed[index]=false;render()};
$('en').onclick=()=>{lang='en';$('finish').classList.contains('hidden')?render():staticText()};
$('zh').onclick=()=>{lang='zh';$('finish').classList.contains('hidden')?render():staticText()};
$('restart').onclick=()=>{index=0;answers.fill(null);revealed.fill(false);solved.fill(false);$('nextaction').value='';$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');render();$('quiz').scrollIntoView({behavior:'smooth'})};
$('copy').onclick=async()=>{const v=$('nextaction').value.trim();if(!v){$('nextaction').focus();return}try{await navigator.clipboard.writeText(v);$('copy').textContent=t('copied')}catch(e){$('nextaction').select();document.execCommand('copy');$('copy').textContent=t('copied')}};
render();</script></body></html>
