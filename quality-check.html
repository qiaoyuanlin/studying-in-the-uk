:root{--navy:#20384e;--navy-dark:#162d42;--green:#54766d;--ink:#34495b;--muted:#60717d;--background:#f8f9f7;--white:#fff;--line:#dfe7e6;--soft:#eef3f1}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--background);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;line-height:1.65}button,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}:focus-visible{outline:3px solid var(--green);outline-offset:3px}.container{width:min(920px,91%);margin:auto}.masthead{background:#fff;border-bottom:1px solid var(--line)}.masthead-in{display:flex;justify-content:space-between;gap:15px;align-items:center;min-height:75px}.brand{text-decoration:none;font-family:Georgia,serif;font-weight:bold;font-size:20px;color:var(--navy)}.topright{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.crumb{color:var(--muted);font-size:13px}.switcher{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.switcher button{border:0;background:#fff;color:var(--navy);padding:7px 11px;font-size:13px;font-weight:600}.switcher button[aria-pressed=true]{background:var(--navy);color:white}.hero{background:linear-gradient(125deg,#fff,#eef3f1);padding:48px 0 38px}.eyebrow{font-size:12px;color:var(--green);font-weight:750;letter-spacing:1.7px;text-transform:uppercase}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--navy);font-weight:normal;line-height:1.25}h1{font-size:clamp(36px,6vw,56px);margin:12px 0 16px}h2{font-size:29px;margin:6px 0 14px}.hero p{max-width:760px;font-size:17px;color:var(--muted);margin:0 0 13px}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.chip{border:1px solid #d4dfdc;padding:5px 11px;border-radius:20px;font-size:12px;color:var(--green);background:white}.main{padding:32px 0 60px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:clamp(20px,5vw,39px);box-shadow:0 5px 20px rgba(25,55,65,.035)}.progressrow{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:13px;font-weight:600}.track{height:7px;background:var(--soft);border-radius:20px;overflow:hidden;margin:13px 0 30px}.fill{height:100%;width:0;background:var(--green);transition:width .2s}.question-tag{font-size:12px;letter-spacing:1.1px;color:var(--green);font-weight:700;text-transform:uppercase}.situation{white-space:pre-line;margin:16px 0 20px;max-width:730px}.ask{font-weight:700;color:var(--navy);margin:0 0 16px}.options{display:grid;gap:11px}.option{display:flex;text-align:left;gap:14px;align-items:flex-start;border:1px solid #d7e2df;background:white;border-radius:7px;padding:15px 17px;color:var(--ink);width:100%;transition:border-color .12s,background .12s}.option:hover:not(:disabled){border-color:var(--green);background:#f7faf8}.letter{width:27px;height:27px;flex-shrink:0;display:grid;place-items:center;border:1px solid #d0dbd9;border-radius:50%;color:var(--navy);font-weight:700;font-size:12px}.option.selected{border:2px solid var(--navy);padding:14px 16px;background:#f6f8f9}.option.correct{border-color:#54766d;background:#f1f6f3}.feedback{margin-top:24px;padding:20px 22px;background:var(--soft);border-left:4px solid var(--green);border-radius:3px}.feedback.wrong{border-left-color:#a77a47;background:#fbf7f0}.feedback h3{font-family:inherit;font-size:17px;font-weight:700;margin:0 0 6px}.feedback p{margin:0}.feedback small{display:block;margin-top:10px;color:var(--muted)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:27px;align-items:center}.btn{border:1px solid #c5d5d0;background:white;color:var(--navy);border-radius:5px;padding:11px 21px;font-size:14px;font-weight:650}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--green);border-color:var(--green)}.btn:hover{background:var(--soft)}.quiet{font-size:13px;color:var(--muted)}.completion p{max-width:740px}.takeaway{background:var(--soft);padding:18px 22px;border-left:3px solid var(--green);margin-top:24px}.takeaway p{margin:7px 0}.reflection{margin-top:23px}.reflection label{font-weight:650;display:block;margin-bottom:9px;color:var(--navy)}textarea{width:100%;min-height:100px;padding:13px;border:1px solid #c5d4d0;border-radius:6px;resize:vertical;color:var(--ink);background:white}footer{background:var(--navy-dark);color:#d5e0e5;padding:25px 0;font-size:12px}.hidden{display:none!important}@media(max-width:600px){.masthead-in{align-items:flex-start;flex-direction:column;padding:14px 0;gap:6px}.hero{padding:32px 0}.panel{padding:19px}.option{padding:13px}.option.selected{padding:12px}h2{font-size:25px}.btn{flex:1 1 130px}}

.focus-label{font-size:12px;letter-spacing:1px;color:var(--green);text-transform:uppercase;font-weight:700;margin:6px 0 10px}.question-remember{margin-top:16px;border-left:3px solid var(--green);padding:12px 16px;background:#f4f7f6;font-size:14px}.editorial{margin-top:14px;padding:10px 13px;background:#fff9e9;border:1px solid #d8b975;border-radius:5px;font-size:13px;color:#705a31}.status-text{font-size:13px;color:var(--muted)}.option:focus-visible{outline:3px solid var(--green);outline-offset:2px}a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.hero .book-link{margin-top:12px}</style></head>

<script>const QUESTIONS=[{"title":["Does AI Answer the Assignment?","AI 回答了作业问题吗？"],"s":["Your assignment asks:\n“Critically evaluate whether social media improves political participation among young people.”\n\nYou ask AI to help you identify relevant arguments.\n\nAI responds:\n“Social media has transformed political communication. It allows politicians to reach large audiences, share their policies and interact directly with voters. These developments have made social media an important tool in modern democratic politics.”","你的作业要求：\n“批判性评价社交媒体是否提高了年轻人的政治参与。”\n\n你请 AI 帮助找出相关论点。\n\nAI 回答：\n“社交媒体改变了政治传播。政治人物能够接触大量受众、分享政策，并与选民直接互动。这些发展使社交媒体成为现代民主政治的重要工具。”"],"ask":["How well does the AI response address your assignment?","AI 的回答在多大程度上回应了作业要求？"],"options":[["It answers the assignment because it explains how social media supports democracy.","它解释了社交媒体如何支持民主，因此回答了作业问题。"],["It is relevant to the topic but focuses on political communication rather than evaluating young people's political participation.","它与主题相关，但重点是政治传播，而非评价年轻人的政治参与。"],["It answers the assignment but needs more examples to strengthen the discussion.","它已经回答了问题，只需增加更多例子。"],["It is unsuitable because it only presents the positive effects of social media.","它只讨论社交媒体的积极影响，因此不合适。"]],"correct":1,"feedback":[["Discussing social media's role in democracy is relevant background, but it does not directly evaluate its effects on young people's political participation.","讨论社交媒体在民主中的作用可以作为相关背景，但没有直接评价它对年轻人政治参与的影响。"],["Recommended. Political communication and political participation are related, but they are not identical. The response does not adequately address the specific question or its requirement for critical evaluation.","推荐选择。政治传播与政治参与有关联，但并不相同。该回答没有充分回应具体问题，也没有满足批判性评价的要求。"],["Additional examples would not resolve the main problem. The response needs to address what the assignment actually asks.","增加例子不能解决根本问题。回答需要回应作业真正提出的问题。"],["The lack of alternative perspectives is a limitation, but the more fundamental issue is that the response does not directly examine young people's political participation.","缺少其他视角是一个局限，但更根本的问题是回答没有直接讨论年轻人的政治参与。"]],"focus":["Direction","方向"],"remember":["An AI response can sound convincing and remain relevant to the topic while missing the assignment's direction.","AI 回答可能听起来有说服力，也与主题有关，却仍然偏离作业真正要求的方向。"],"provisional":false},{"title":["Should I Change My Direction?","我应该改变方向吗？"],"s":["Your assignment asks:\n“Critically evaluate whether social media improves political participation among young people.”\n\nYou have decided to argue that social media improves political participation because it gives young people easier access to political information and opportunities to express their views.\n\nYou ask AI to comment on your approach.\n\nAI responds:\n“Access to political information and online discussions does not necessarily lead to greater political participation. Young people may engage with political content on social media without taking part in activities such as voting, campaigning or contacting political representatives. Your argument may need to consider this distinction.”","你的作业要求：\n“批判性评价社交媒体是否提高了年轻人的政治参与。”\n\n你决定论证社交媒体提高了政治参与，因为它让年轻人更容易获取政治信息、表达观点。\n\n你请 AI 评价你的思路。\n\nAI 回答：\n“获取政治信息和参与线上讨论，不一定带来更多实际政治参与。年轻人可能在社交媒体上接触政治内容，却不参加投票、竞选活动或联系民意代表。你的论证可能需要考虑这一差别。”"],"ask":["What should you do next?","接下来你应该怎么做？"],"options":[["Continue with your original approach because you have already decided what to argue.","已经决定好论点，因此坚持原来的方向。"],["Change your approach because AI has introduced a different perspective.","AI 提出了不同观点，因此改变方向。"],["Consider whether the new perspective changes how you should approach the assignment, then decide whether to keep, adjust or change your direction.","考虑新观点是否影响作业的论证方式，再决定保留、调整或改变方向。"],["Include both perspectives equally so your assignment appears balanced.","平均呈现两个观点，让作业看起来更平衡。"]],"correct":2,"feedback":[["Having an initial direction is useful, but it should not prevent you from considering new perspectives that may help you address the assignment more effectively.","有初步方向是有帮助的，但不应因此拒绝考虑可能让论证更切题的新观点。"],["A different perspective is not automatically a better one. Changing direction requires a reason, not simply an AI suggestion.","不同观点不一定更好。改变方向需要理由，而不是仅仅因为 AI 提出了建议。"],["Recommended. The AI response raises a distinction directly relevant to the assignment. Consider whether your approach adequately addresses political participation before deciding whether to retain, refine or change your direction.","推荐选择。AI 提出的区别与作业直接相关。在决定保留、完善还是改变方向之前，先考虑当前论证是否充分回应了政治参与这一问题。"],["Critical evaluation does not require giving every perspective equal weight. Your approach should reflect the assignment requirements and the reasoning you develop.","批判性评价不意味着给予每种观点相同分量。你应根据作业要求和自己形成的推理安排论证。"]],"focus":["Direction","方向"],"remember":["Having a direction does not mean refusing to reconsider it. Being challenged does not mean you must change it.","有方向不代表拒绝重新思考；受到质疑也不意味着必须改变方向。"],"provisional":false},{"title":["When Better English Is Not Better Writing","英语更正式，不等于写得更好"],"s":["You are writing an assignment about the relationship between part-time employment and university performance.\n\nYour original sentence is:\n“Students who work long hours may have less time to study, which could affect their academic performance.”\n\nYou ask AI to make it sound more academic.\n\nAI responds:\n“The extensive engagement of university students in employment-related commitments may generate significant implications for academic performance through changes in the allocation of available temporal resources.”\n\nThe sentence sounds more formal.","你正在写一篇关于兼职工作与大学学习表现关系的作业。\n\n你的原句是：\n“长时间工作的学生可能有更少的时间学习，从而影响学业表现。”\n\n你请 AI 把句子改得更学术。\n\nAI 回答：\n“大学生大量参与就业相关事务，可能通过改变可用时间资源的分配，对其学业表现产生显著影响。”\n\n改写后的句子听起来更正式。"],"ask":["What is the best judgement about this rewrite?","你如何评价这次改写？"],"options":[["The rewrite is better because more sophisticated vocabulary makes the point more academic.","改写用词更复杂，所以更学术、更好。"],["The rewrite is better because it is longer and therefore shows more developed thinking.","改写更长，因此体现了更深入的思考。"],["The original sentence explains the relationship more clearly; the rewrite makes it harder to follow without improving precision.","原句更清楚地解释了关系；改写更难理解，也没有提高准确性。"],["The rewrite should be rejected simply because academic writing must always use simple words.","应该拒绝改写，因为学术写作永远只能使用简单词汇。"]],"correct":2,"feedback":[["More sophisticated vocabulary can be useful when it expresses an idea more precisely. Here, the additional complexity does not improve the explanation.","复杂词汇有时可以更准确地表达观点，但这里额外的复杂性没有改善解释。"],["A longer sentence does not necessarily contain more developed thinking. The rewrite uses more words without explaining the relationship more effectively.","句子更长，不代表思考更深入。改写增加了字数，却没有更有效地说明关系。"],["Recommended. The original sentence clearly connects working hours, study time and academic performance. The AI rewrite sounds more formal but makes this relationship harder to follow. Academic expression should improve clarity, precision and appropriateness, not simply complexity.","推荐选择。原句清楚地连接了工作时长、学习时间和学业表现。AI 改写更正式，却使这一关系更难理解。学术表达应提高表达的清晰度、准确性和恰当性，而不只是复杂程度。"],["Academic writing sometimes requires technical or complex language to communicate ideas accurately. The aim is not always to use simpler words, but to choose language that best expresses the intended meaning.","学术写作有时需要技术性或复杂语言来准确传达观点。目标并非永远选择简单词汇，而是选择最能表达原意的语言。"]],"focus":["Expression","表达"],"remember":["Good academic expression is not about choosing the simplest or most sophisticated words. It is about communicating your ideas clearly, precisely and appropriately.","好的学术表达不在于使用最简单或最复杂的词，而在于清晰、准确、恰当地传达自己的观点。"],"provisional":true},{"title":["When AI Makes Your Argument Stronger Than You Intended","当 AI 把你的论点说得比原意更强"],"s":["You are writing about whether part-time employment affects students' academic performance.\n\nYour original argument is:\n“Working part-time may affect academic performance, particularly when students work long hours. However, the effect could differ depending on their circumstances.”\n\nYou ask AI to improve the academic expression without changing your argument.\n\nAI responds:\n“Part-time employment significantly reduces academic performance among university students, demonstrating that employment is a major cause of poor academic achievement.”","你正在写一篇关于兼职工作是否影响学生学业表现的作业。\n\n你的原始论点：\n“兼职可能影响学业表现，尤其是工作时长较长时。不过，影响也可能因个人情况而异。”\n\n你请 AI 改善学术表达，但不改变论点。\n\nAI 回答：\n“兼职显著降低大学生的学业表现，表明就业是学业成绩不佳的一个主要原因。”"],"ask":["What is the most important change AI has made?","AI 做出的最重要改变是什么？"],"options":[["It uses stronger academic language, which makes the argument more convincing.","它采用更强的学术用语，因此论点更有说服力。"],["It changes a possible relationship into a definite negative effect and a causal claim.","它把一种可能的关系改成确定的负面影响和因果主张。"],["It improves the argument by removing uncertainty from the original statement.","它消除了原句的不确定性，因此改善了论证。"],["It is acceptable because the main topic—part-time employment and academic performance—remains the same.","主题仍是兼职与学业表现，所以改写可以接受。"]],"correct":1,"feedback":[["Stronger language may sound more convincing, but it does not necessarily make an argument stronger. The important question is whether the claim is justified.","更有力的措辞可能听起来更有说服力，但不一定使论证更强。关键是主张是否有充分依据。"],["Recommended. The original argument says employment may affect performance and recognises that circumstances matter. The AI rewrite says employment significantly reduces performance and is a major cause of poor achievement. These are stronger claims that the original argument did not establish.","推荐选择。原句认为兼职可能影响表现，并承认情况不同会有差异。AI 改写却声称兼职显著降低表现，还是成绩不佳的主要原因。这些更强的主张并非原论点所确立。"],["Academic writing does not always require certainty. Words such as may, could and depending on can be important because they show the limits of what we know. Removing them can change the meaning.","学术写作不一定要求确定无疑。“可能”“或许”“取决于”等词能体现已知结论的界限。删去它们会改变含义。"],["Two sentences can discuss the same topic while making very different claims. You need to check what the AI rewrite actually says, not simply whether it remains on topic.","两个句子即使讨论同一主题，也可能提出十分不同的主张。要核查 AI 实际写出了什么，而不只是主题是否相同。"]],"focus":["Meaning","含义"],"remember":["When AI improves your writing, check whether it has also changed what you mean. More confident language does not automatically mean a stronger argument.","当 AI 改善表达时，还要检查它是否改变了你的原意。更肯定的措辞不一定代表论点更强。"],"provisional":false},{"title":["A Convincing Claim Without Enough Evidence","有说服力的主张，证据却不足"],"s":["You are writing an assignment about the relationship between lecture attendance and academic performance.\n\nYou ask AI to recommend five academic papers relevant to your assignment.\n\nAI responds:\n“Here are five academic papers that examine the relationship between lecture attendance and student performance.”\n\nAI provides five paper titles, authors and publication details.","你正在写一篇关于课堂出勤与学业表现关系的作业。\n\n你请 AI 推荐五篇相关学术论文。\n\nAI 回答：\n“以下五篇学术论文研究了课堂出勤与学生表现之间的关系。”\n\nAI 提供了五篇论文的标题、作者和出版信息。"],"ask":["What should you do next?","接下来你应该怎么做？"],"options":[["Use the references because AI has identified them as relevant academic papers.","AI 已将它们列为相关论文，所以直接使用。"],["Check that the papers exist, then include them in your assignment.","确认论文真实存在后，就把它们写进作业。"],["Locate the papers, read the relevant sections and check whether their findings support the points you want to make.","找到论文，阅读相关部分，并检查其研究结果是否支持你想提出的观点。"],["Ask AI to summarise the five papers and use those summaries to support your argument.","请 AI 概括五篇论文，再用摘要支持论点。"]],"correct":2,"feedback":[["AI can suggest useful sources, but its recommendations are not automatically reliable. Some references may be incorrect or may not exist.","AI 能推荐有用资料，但推荐不一定可靠。有些参考文献可能有误，甚至不存在。"],["Checking that a paper exists is an important first step, but existence alone does not establish its relevance or what its findings support.","核实论文存在是重要的第一步，但它的存在本身并不能证明其相关性或研究结论支持什么。"],["Recommended. Verify that the papers exist, read the relevant sections and examine their findings. Decide which sources are useful and what claims they can reasonably support.","推荐选择。先核实论文存在，再阅读相关部分并检查研究结果。由你决定哪些来源有用，以及它们能合理支持哪些主张。"],["AI summaries can help you explore unfamiliar research, but they may omit important qualifications or misrepresent findings. Check the original sources before relying on them.","AI 摘要有助于初步探索研究，但可能遗漏重要限制或曲解结果。在依赖这些内容前，应查看原始文献。"]],"focus":["Evidence and reliability","证据与可靠性"],"remember":["AI can help you find academic sources, but you need to verify, read and evaluate them before using them to support your work.","AI 可以帮助查找学术资料，但在用它们支持论点前，需要核实、阅读和评价。"],"provisional":false},{"title":["Keep, Change or Reject?","保留、修改还是拒绝？"],"s":["You are learning about correlation and causation. You ask AI to explain the difference between them.\n\nAI responds:\n“When two variables are strongly correlated, it means that changes in one variable cause changes in the other.”","你正在学习相关关系与因果关系的区别，并请 AI 解释。\n\nAI 回答：\n“当两个变量具有很强的相关性时，就意味着一个变量的变化会导致另一个变量发生变化。”"],"ask":["What should you do next?","接下来你应该怎么做？"],"options":[["Accept the explanation because a strong correlation indicates a causal relationship.","接受解释，因为高度相关表明因果关系。"],["Ask AI to explain the same point in simpler language.","请 AI 用更简单的语言重述同样的观点。"],["Question the explanation and check your module materials or other reliable sources to clarify the difference.","质疑这一解释，并查看课程材料或其他可靠来源，弄清两者的区别。"],["Use the explanation because it is clear and easy to understand.","解释清楚、容易理解，所以直接采用。"]],"correct":2,"feedback":[["A strong correlation does not necessarily mean that one variable causes changes in the other.","高度相关不一定意味着一个变量导致另一个变量发生变化。"],["A simpler explanation may be easier to understand, but it will not necessarily correct an inaccurate one.","表达更简单也许更容易理解，但不一定能纠正错误。"],["Recommended. Correlation describes an association between variables, while causation concerns whether changes in one produce changes in the other. A strong correlation alone cannot establish causation.","推荐选择。相关关系描述变量之间的关联；因果关系涉及一个变量的变化是否导致另一个变量变化。仅凭高度相关不能确立因果关系。"],["An explanation can sound clear and convincing while still being incorrect. You need to check its accuracy.","解释可能清晰又有说服力，但仍然不正确。需要核查其准确性。"]],"focus":["Overall quality judgement","整体质量判断"],"remember":["Understanding an AI explanation does not necessarily mean it is correct. Check important concepts against reliable learning materials.","能够理解 AI 的解释，不代表解释一定正确。应对照可靠的学习材料核查重要概念。"],"provisional":false}];
const COPY={"en":{"section":"Learning with AI · Practice & Quizzes","eyebrow":"02 · While Working with AI","title":"Quality Check","intro":"An AI response may sound convincing without being accurate, relevant or useful for your learning.","introExtra":"Check three things: Direction — does it address your task? Expression — is it clear and appropriate? Meaning — does it make sense, preserve your intended meaning and support its claims?","intro2":"Choose an answer to see an explanation immediately, and try again if useful. For the wider approach to learning with AI, explore Chapter 7 of the book.","bookLink":"Explore the book and its wider learning approach","six":"6 everyday situations","instant":"Immediate feedback","retry":"Retry when needed","progress":"Question {n} of 6","count":"{n} completed","tag":"YOUR DECISION","correct":"Recommended choice","wrong":"Consider this","hint":"You can reconsider your answer or continue to the next question.","prev":"Previous","again":"Try again","next":"Next question","finish":"Finish & reflect","remember":"Remember","draft":"Editorial note: The four answer choices for this question are provisional because they were missing from the source document. Review before publishing.","completeEyebrow":"QUALITY CHECK · COMPLETE","completeTitle":"What to Remember","take1":"A convincing AI response is not necessarily a good response.","take2":"AI can provide useful explanations, suggestions and evidence, but it can also miss the task, change your meaning or make unsupported claims. The judgement about what to trust, question or use remains yours.","stepTitle":"Your Next Step","step1":"Think of an AI response you have recently received, or return to one of the examples in this quiz.","step2":"Identify one thing you would keep, question or change, and explain why.","step3":"Before applying AI assistance to assessed work, check that it is permitted. Return to Boundary Check if you are unsure or the nature of the assistance changes. You can then explore Ownership Check.","actionPrompt":"Optional: Write down one judgement and your reason","placeholder":"I would keep, question or change… because…","privacy":"Your response stays in this browser page and may be lost when you refresh. It is not submitted or assessed.","restart":"Start again","copy":"Copy my reflection","back":"Return to Learning with AI","footer":"Studying in the UK · Learning with AI · Quality Check","copied":"Copied","quality":"Quality Check","boundary":"Boundary Check","ownership":"Ownership Check","bookChapter":"Chapter 7 — Learning in the AI Era: Boundaries, Judgement, and Ownership"},"zh":{"section":"与 AI 一起学习 · 练习与测验","eyebrow":"02 · 与 AI 合作时","title":"质量检查","intro":"AI 的回答可能听起来很有说服力，却未必准确、切题或有助于学习。","introExtra":"检查三个方面：方向——是否回应了真正的任务？表达——是否清晰、恰当？含义——内容是否合理、保留原意，并有依据支持其主张？","intro2":"选择答案后即可查看解释，需要时可以重新尝试。如想了解更完整的 AI 学习方法，可阅读本书第七章。","bookLink":"探索本书及更完整的学习方法","six":"6 个日常情境","instant":"即时反馈","retry":"需要时重试","progress":"第 {n} 题，共 6 题","count":"已完成 {n} 题","tag":"你的决定","correct":"推荐选择","wrong":"请考虑这一点","hint":"你可以重新选择，也可以继续下一题。","prev":"上一题","again":"再试一次","next":"下一题","finish":"完成并反思","remember":"请记住","draft":"编辑提示：原始文档缺少本题的四个选项；目前选项为临时拟定，正式发布前需要审核。","completeEyebrow":"质量检查 · 已完成","completeTitle":"值得记住","take1":"AI 的回答即使有说服力，也未必是好的回答。","take2":"AI 能提供解释、建议和证据，但也可能偏离任务、改变你的原意或提出缺乏依据的主张。决定哪些内容值得相信、质疑或采用，仍然需要你自己判断。","stepTitle":"你的下一步","step1":"回想最近收到的一条 AI 回答，或回到本测验中的某个例子。","step2":"指出其中一项你会保留、质疑或修改的内容，并解释原因。","step3":"将 AI 协助用于考核作品前，请先核查是否允许。不确定或协助形式变化时，可返回“边界检查”，之后再探索“所有权检查”。","actionPrompt":"可选：写下你的判断和理由","placeholder":"我会保留、质疑或修改……因为……","privacy":"你的回答只留在当前浏览器页面，刷新后可能丢失；不会提交或评分。","restart":"重新开始","copy":"复制我的反思","back":"返回 Learning with AI","footer":"Studying in the UK · 与 AI 一起学习 · 质量检查","copied":"已复制","quality":"质量检查","boundary":"边界检查","ownership":"所有权检查","bookChapter":"第七章 — Learning in the AI Era: Boundaries, Judgement, and Ownership"}};
let lang='en',index=0;
let answers=Array(QUESTIONS.length).fill(null),revealed=Array(QUESTIONS.length).fill(false),solved=Array(QUESTIONS.length).fill(false);
const $=id=>document.getElementById(id), t=k=>COPY[lang][k], li=()=>lang==='en'?0:1;
function staticText(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});document.querySelectorAll('[data-i-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.iPlaceholder)});$('en').setAttribute('aria-pressed',String(lang==='en'));$('zh').setAttribute('aria-pressed',String(lang==='zh'));}
function render(){staticText();const q=QUESTIONS[index],count=solved.filter(Boolean).length;
$('progresslabel').textContent=t('progress').replace('{n}',index+1);$('countlabel').textContent=t('count').replace('{n}',count);$('fill').style.width=(count/QUESTIONS.length*100)+'%';$('progress').setAttribute('aria-valuenow',count);$('focus').textContent=q.focus[li()];$('qtitle').textContent=q.title[li()];$('situation').textContent=q.s[li()];$('ask').textContent=q.ask[li()];
$('options').replaceChildren();q.options.forEach((op,i)=>{let b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('aria-pressed',String(answers[index]===i));if(answers[index]===i)b.classList.add('selected');if(answers[index]===i&&i===q.correct)b.classList.add('correct');let letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];let content=document.createElement('span');content.textContent=op[li()];b.append(letter,content);b.addEventListener('click',()=>pick(i));$('options').append(b)});
$('feedback').classList.toggle('hidden',!revealed[index]);$('rememberBox').classList.toggle('hidden',!revealed[index]);$('rememberText').textContent=q.remember[li()];$('editorial').classList.toggle('hidden',!q.provisional);
if(revealed[index]){$('feedback').classList.toggle('wrong',answers[index]!==q.correct);$('feedbacktitle').textContent=answers[index]===q.correct?t('correct'):t('wrong');$('feedbackbody').textContent=q.feedback[answers[index]][li()];$('feedbackhint').textContent=answers[index]===q.correct?'':t('hint')}
$('prev').textContent=t('prev');$('prev').disabled=index===0;$('again').hidden=!revealed[index]||answers[index]===q.correct;$('again').textContent=t('again');$('next').textContent=index===QUESTIONS.length-1?t('finish'):t('next');$('next').disabled=!revealed[index]}
function pick(i){answers[index]=i;revealed[index]=true;if(i===QUESTIONS[index].correct)solved[index]=true;render();$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});}
function showFinish(){staticText();$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('finish').focus();window.scrollTo({top:0,behavior:'smooth'})}
$('prev').onclick=()=>{if(index>0){index--;render()}};
$('next').onclick=()=>{if(index<QUESTIONS.length-1){index++;render();$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}else showFinish()};
$('again').onclick=()=>{answers[index]=null;revealed[index]=false;render()};
$('en').onclick=()=>{lang='en';$('finish').classList.contains('hidden')?render():staticText()};
$('zh').onclick=()=>{lang='zh';$('finish').classList.contains('hidden')?render():staticText()};
$('restart').onclick=()=>{index=0;answers.fill(null);revealed.fill(false);solved.fill(false);$('nextaction').value='';$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');render();$('quiz').scrollIntoView({behavior:'smooth'})};
$('copy').onclick=async()=>{const v=$('nextaction').value.trim();if(!v){$('nextaction').focus();return}try{await navigator.clipboard.writeText(v);$('copy').textContent=t('copied')}catch(e){$('nextaction').select();document.execCommand('copy');$('copy').textContent=t('copied')}};
render();</script></body></html>
