y:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:13px;font-weight:600}.track{height:7px;background:var(--soft);border-radius:20px;overflow:hidden;margin:13px 0 30px}.fill{height:100%;width:0;background:var(--green);transition:width .2s}.question-tag{font-size:12px;letter-spacing:1.1px;color:var(--green);font-weight:700;text-transform:uppercase}.situation{white-space:pre-line;margin:16px 0 20px;max-width:730px}.ask{font-weight:700;color:var(--navy);margin:0 0 16px}.options{display:grid;gap:11px}.option{display:flex;text-align:left;gap:14px;align-items:flex-start;border:1px solid #d7e2df;background:white;border-radius:7px;padding:15px 17px;color:var(--ink);width:100%;transition:border-color .12s,background .12s}.option:hover:not(:disabled){border-color:var(--green);background:#f7faf8}.letter{width:27px;height:27px;flex-shrink:0;display:grid;place-items:center;border:1px solid #d0dbd9;border-radius:50%;color:var(--navy);font-weight:700;font-size:12px}.option.selected{border:2px solid var(--navy);padding:14px 16px;background:#f6f8f9}.option.correct{border-color:#54766d;background:#f1f6f3}.feedback{margin-top:24px;padding:20px 22px;background:var(--soft);border-left:4px solid var(--green);border-radius:3px}.feedback.wrong{border-left-color:#a77a47;background:#fbf7f0}.feedback h3{font-family:inherit;font-size:17px;font-weight:700;margin:0 0 6px}.feedback p{margin:0}.feedback small{display:block;margin-top:10px;color:var(--muted)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:27px;align-items:center}.btn{border:1px solid #c5d5d0;background:white;color:var(--navy);border-radius:5px;padding:11px 21px;font-size:14px;font-weight:650}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--green);border-color:var(--green)}.btn:hover{background:var(--soft)}.quiet{font-size:13px;color:var(--muted)}.completion p{max-width:740px}.takeaway{background:var(--soft);padding:18px 22px;border-left:3px solid var(--green);margin-top:24px}.takeaway p{margin:7px 0}.reflection{margin-top:23px}.reflection label{font-weight:650;display:block;margin-bottom:9px;color:var(--navy)}textarea{width:100%;min-height:100px;padding:13px;border:1px solid #c5d4d0;border-radius:6px;resize:vertical;color:var(--ink);background:white}footer{background:var(--navy-dark);color:#d5e0e5;padding:25px 0;font-size:12px}.hidden{display:none!important}@media(max-width:600px){.masthead-in{align-items:flex-start;flex-direction:column;padding:14px 0;gap:6px}.hero{padding:32px 0}.panel{padding:19px}.option{padding:13px}.option.selected{padding:12px}h2{font-size:25px}.btn{flex:1 1 130px}}

<script>const QUESTIONS=[{"title":["Does AI Answer the Assignment?","AI 真的回答了作业问题吗？"],"s":["Your assignment asks:\n“Critically evaluate whether social media improves political participation among young people.”\n\nYou ask AI to help you identify relevant arguments.\n\nAI responds:\n“Social media has transformed political communication. It allows politicians to reach large audiences, share their policies and interact directly with voters. These developments have made social media an important tool in modern democratic politics.”","你的作业要求：\n“批判性评价社交媒体是否提高了年轻人的政治参与度。”\n\n你请 AI 帮你寻找相关论点。\n\nAI 的回答：\n“社交媒体改变了政治传播方式。政治人物可以通过社交媒体接触更多受众、宣传政策，并直接与选民互动。因此，社交媒体已成为现代民主政治的重要工具。”"],"ask":["How well does the AI response address your assignment?","这段回答是否符合你的作业要求？"],"options":[["It answers the assignment because it explains how social media supports democracy.","符合。它解释了社交媒体如何促进民主政治，因此回答了作业问题。"],["It is relevant to the topic but focuses on political communication rather than evaluating young people's political participation.","与主题有关，但重点放在政治传播，而不是评价年轻人的政治参与。"],["It answers the assignment but needs more examples to strengthen the discussion.","已经回答了作业问题，只需要增加一些例子。"],["It is unsuitable because it only presents the positive effects of social media.","不合适，因为它只讨论了社交媒体的积极影响。"]],"correct":1,"feedback":[["Discussing social media's role in democracy is relevant background, but it does not directly evaluate its effects on young people's political participation.","社交媒体对民主政治的作用可以作为相关背景，但这段回答并没有直接评价它是否提高了年轻人的政治参与度。"],["Recommended. Political communication and political participation are related, but they are not identical. The response does not adequately address the specific question or its requirement for critical evaluation.","政治传播和政治参与虽然有关联，但并不是一回事。AI 的回答主要讨论政治人物如何利用社交媒体传播信息，没有充分回应作业的核心问题，也没有达到批判性评价（Critical Evaluation）的要求。"],["Additional examples would not resolve the main problem. The response needs to address what the assignment actually asks.","增加例子可能让内容更丰富，但不能解决偏离题目的问题。首先要确保论述真正回应了作业要求。"],["The lack of alternative perspectives is a limitation, but the more fundamental issue is that the response does not directly examine young people's political participation.","缺少不同视角确实是一个问题，但更根本的问题是：AI 没有直接讨论年轻人的政治参与。"]],"focus":["Direction","方向（Direction）"],"remember":["An AI response can sound convincing and remain relevant to the topic while missing the assignment's direction.","AI 的回答即使听起来很有道理，也与主题有关，仍然可能没有真正回答作业提出的问题。"]},{"title":["Should I Change My Direction?","我应该改变原来的思路吗？"],"s":["Your assignment asks:\n“Critically evaluate whether social media improves political participation among young people.”\n\nYou have decided to argue that social media improves political participation because it gives young people easier access to political information and opportunities to express their views.\n\nYou ask AI to comment on your approach.\n\nAI responds:\n“Access to political information and online discussions does not necessarily lead to greater political participation. Young people may engage with political content on social media without taking part in activities such as voting, campaigning or contacting political representatives. Your argument may need to consider this distinction.”","你的作业要求：\n“批判性评价社交媒体是否提高了年轻人的政治参与度。”\n\n你打算论证社交媒体促进了年轻人的政治参与，因为它让年轻人更容易获取政治信息、表达自己的观点。\n\n你请 AI 对这个思路提出意见。\n\nAI 的回答：\n“能够获取政治信息、参与网上讨论，并不一定意味着政治参与度有所提高。年轻人可能经常在社交媒体上接触政治内容，却未必会参加投票、参与政治活动，或联系民意代表。你的论证可能需要考虑这一区别。”"],"ask":["What should you do next?","接下来，你应该怎么做？"],"options":[["Continue with your original approach because you have already decided what to argue.","我已经确定了自己的论点，应该坚持原来的思路。"],["Change your approach because AI has introduced a different perspective.","AI 提出了不同意见，所以我应该改变原来的思路。"],["Consider whether the new perspective changes how you should approach the assignment, then decide whether to keep, adjust or change your direction.","先考虑 AI 提出的观点是否影响自己的论证，再决定保留、调整还是改变原来的思路。"],["Include both perspectives equally so your assignment appears balanced.","两种观点各写一半，这样作业看起来更全面、更平衡。"]],"correct":2,"feedback":[["Having an initial direction is useful, but it should not prevent you from considering new perspectives that may help you address the assignment more effectively.","有一个初步思路是好事，但这不意味着不能重新思考。如果新的观点能够帮助你更好地回答作业问题，就值得认真考虑。"],["A different perspective is not automatically a better one. Changing direction requires a reason, not simply an AI suggestion.","AI 提出不同意见，并不代表它一定正确。是否改变思路，应该取决于你的分析和判断，而不是 AI 的建议本身。"],["Recommended. The AI response raises a distinction directly relevant to the assignment. Consider whether your approach adequately addresses political participation before deciding whether to retain, refine or change your direction.","AI 指出了一个与作业直接相关的区别：接触政治信息不等于实际参与政治活动。你需要考虑原来的论证是否充分回应了这一问题，再决定是继续坚持、进一步完善，还是调整方向。"],["Critical evaluation does not require giving every perspective equal weight. Your approach should reflect the assignment requirements and the reasoning you develop.","批判性评价（Critical Evaluation）并不是把不同观点平均分配篇幅，而是要根据证据和推理，判断哪些观点更有说服力，并形成自己的结论。"]],"focus":["Direction","方向（Direction）"],"remember":["Having a direction does not mean refusing to reconsider it. Being challenged does not mean you must change it.","有自己的思路，不代表不能重新考虑；AI 提出质疑，也不意味着你必须改变方向。关键在于你能否说明自己为什么这样选择。"]},{"title":["When Better English Is Not Better Writing","英文更正式，就一定写得更好吗？"],"s":["You are writing an assignment about the relationship between part-time employment and university performance.\n\nYour original sentence is:\n“Students who work long hours may have less time to study, which could affect their academic performance.”\n\nYou ask AI to make it sound more academic.\n\nAI responds:\n“The extensive engagement of university students in employment-related commitments may generate significant implications for academic performance through changes in the allocation of available temporal resources.”\n\nThe sentence sounds more formal.","你正在写一篇关于兼职工作与大学生学业表现之间关系的作业。\n\n你的原句是：\n“学生如果花太多时间做兼职，可能会减少学习时间，从而影响学业表现。”\n\n你请 AI 把这句话改得更符合学术写作（Academic Writing）的风格。\n\nAI 的改写：\n“大学生大量参与就业相关事务，可能通过改变可用时间资源的分配，对其学业表现产生显著影响。”\n\n改写后的句子听起来更加正式。"],"ask":["What is the best judgement about this rewrite?","你如何评价这次改写？"],"options":[["The rewrite is better because more sophisticated vocabulary makes the point more academic.","改写使用了更复杂的词汇，因此更符合学术写作的要求。"],["The rewrite is better because it is longer and therefore shows more developed thinking.","改写后的句子更长，说明分析更加深入。"],["The original sentence explains the relationship more clearly; the rewrite makes it harder to follow without improving precision.","原句更清楚地说明了两者之间的关系。改写虽然更正式，却更难理解，也没有提高表达的准确性。"],["The rewrite is less effective because academic writing should generally avoid complex vocabulary.","改写不好，因为学术写作应该尽量避免复杂词汇。"]],"correct":2,"feedback":[["More sophisticated vocabulary can be useful when it expresses an idea more precisely. Here, the additional complexity does not improve the explanation.","复杂词汇有时可以帮助我们更准确地表达观点，但这次改写虽然用词更复杂，却没有让意思变得更清楚。"],["A longer sentence does not necessarily contain more developed thinking. The rewrite uses more words without explaining the relationship more effectively.","句子更长，不代表分析更深入。这次改写增加了字数，却没有更好地解释兼职时间与学业表现之间的关系。"],["Recommended. The original sentence clearly connects working hours, study time and academic performance. The AI rewrite sounds more formal but makes this relationship harder to follow. Academic expression should improve clarity, precision and appropriateness, not simply complexity.","原句清楚地说明了兼职时间、学习时间和学业表现之间可能存在的联系。AI 的改写虽然听起来更正式，却让这一关系变得不够清晰。好的学术表达应该清楚、准确、恰当地传达观点，而不是一味追求复杂的词汇和句式。"],["Academic writing sometimes requires technical or complex language to communicate ideas accurately. The aim is not always to use simpler words, but to choose language that best expresses the intended meaning.","学术写作有时确实需要使用专业术语或较复杂的表达。问题不在于词汇是否复杂，而在于它能否准确、清楚地表达你的意思。"]],"focus":["Expression","表达（Expression）"],"remember":["Good academic expression is not about choosing the simplest or most sophisticated words. It is about communicating your ideas clearly, precisely and appropriately.","好的学术写作，不是把简单的话说得复杂，而是把自己的观点表达得清楚、准确、有条理。"]},{"title":["When AI Makes Your Argument Stronger Than You Intended","当 AI 把你的论点改得过于肯定"],"s":["You are writing about whether part-time employment affects students' academic performance.\n\nYour original argument is:\n“Working part-time may affect academic performance, particularly when students work long hours. However, the effect could differ depending on their circumstances.”\n\nYou ask AI to improve the academic expression without changing your argument.\n\nAI responds:\n“Part-time employment significantly reduces academic performance among university students, demonstrating that employment is a major cause of poor academic achievement.”","你正在写一篇关于兼职工作是否影响大学生学业表现的作业。\n\n你的原始论点是：\n“兼职工作可能影响学生的学业表现，尤其是在工作时间较长的情况下。不过，具体影响也可能因个人情况而异。”\n\n你请 AI 改善这段话的学术表达，但不要改变原来的意思。\n\nAI 的改写：\n“兼职工作显著降低了大学生的学业表现，这表明兼职是导致学业成绩不佳的主要原因之一。”"],"ask":["What is the most important change AI has made?","AI 的改写出现了什么重要变化？"],"options":[["It uses stronger academic language, which makes the argument more convincing.","使用了更有力的学术语言，因此论点更有说服力。"],["It changes a possible relationship into a definite negative effect and a causal claim.","把原本不确定的关系，改成了确定的负面影响，并进一步提出了因果关系。"],["It improves the argument by removing uncertainty from the original statement.","去掉了原句中的不确定性，因此论证更加严谨。"],["It is acceptable because the main topic—part-time employment and academic performance—remains the same.","仍然在讨论兼职与学业表现，因此可以接受。"]],"correct":1,"feedback":[["Stronger language may sound more convincing, but it does not necessarily make an argument stronger. The important question is whether the claim is justified.","语气更肯定，可能让论点听起来更有说服力，但不代表论证本身更有力。关键还是要看这些主张是否有充分的证据支持。"],["Recommended. The original argument says employment may affect performance and recognises that circumstances matter. The AI rewrite says employment significantly reduces performance and is a major cause of poor achievement. These are stronger claims that the original argument did not establish.","原句只是说兼职“可能”影响学业表现，而且这种影响因人而异。AI 却改成了兼职“显著降低”学业表现，并认为它是成绩不佳的主要原因之一。这些说法比原来的论点强得多，而且原文并没有提供足够依据来支持它们。"],["Academic writing does not always require certainty. Words such as may, could and depending on can be important because they show the limits of what we know. Removing them can change the meaning.","学术写作并不是越肯定越好。“可能”“或许”“取决于”等表达，有时恰恰体现了对证据局限性的认识。去掉这些限定词，可能会改变原来的意思。"],["Two sentences can discuss the same topic while making very different claims. You need to check what the AI rewrite actually says, not simply whether it remains on topic.","即使讨论的是同一个主题，两种表述也可能提出完全不同的主张。检查 AI 的改写时，不仅要看主题有没有改变，还要看原来的意思是否得到了保留。"]],"focus":["Meaning","含义（Meaning）"],"remember":["When AI improves your writing, check whether it has also changed what you mean. More confident language does not automatically mean a stronger argument.","AI 可以帮你改善表达，但不能因此忽略它是否改变了你的原意。语气更肯定，不代表论点更有依据。"]},{"title":["A Convincing Claim Without Enough Evidence","AI 推荐的学术论文，能直接用吗？"],"s":["You are writing an assignment about the relationship between lecture attendance and academic performance.\n\nYou ask AI to recommend five academic papers relevant to your assignment.\n\nAI responds:\n“Here are five academic papers that examine the relationship between lecture attendance and student performance.”\n\nAI provides five paper titles, authors and publication details.","你正在写一篇关于课堂出勤率与学业表现之间关系的作业。\n\n你请 AI 推荐五篇相关的学术论文。\n\nAI 的回答：\n“以下五篇学术论文研究了课堂出勤率与学生学业表现之间的关系。”\n\n随后，AI 列出了五篇论文的标题、作者和出版信息。"],"ask":["What should you do next?","接下来，你应该怎么做？"],"options":[["Use the references because AI has identified them as relevant academic papers.","AI 已经推荐了这些论文，说明它们与我的作业有关，可以直接引用。"],["Check that the papers exist, then include them in your assignment.","先确认这些论文真实存在，然后就可以放进作业的参考文献中。"],["Locate the papers, read the relevant sections and check whether their findings support the points you want to make.","找到这些论文，阅读相关内容，并检查研究结果是否支持自己的论点。"],["Ask AI to summarise the five papers and use those summaries to support your argument.","请 AI 概括这五篇论文，然后根据 AI 的摘要引用相关研究。"]],"correct":2,"feedback":[["AI can suggest useful sources, but its recommendations are not automatically reliable. Some references may be incorrect or may not exist.","AI 可以帮助我们寻找文献，但它提供的信息不一定可靠。有些参考文献可能存在错误，甚至可能根本不存在。"],["Checking that a paper exists is an important first step, but existence alone does not establish its relevance or what its findings support.","确认论文真实存在是重要的第一步，但这还不够。你还需要判断论文是否真的与作业有关，以及研究结果是否支持你想提出的观点。"],["Recommended. Verify that the papers exist, read the relevant sections and examine their findings. Decide which sources are useful and what claims they can reasonably support.","首先确认论文真实存在，再阅读与作业有关的部分，了解研究方法、主要发现及其局限性。最后，由你自己判断哪些文献值得使用，以及它们能够支持什么样的结论。"],["AI summaries can help you explore unfamiliar research, but they may omit important qualifications or misrepresent findings. Check the original sources before relying on them.","AI 的摘要可以帮助你初步了解研究内容，但也可能遗漏重要信息，甚至误解研究结果。正式引用之前，应该核查原始文献，而不能只依赖 AI 的概括。"]],"focus":["Evidence and reliability","证据与可靠性（Evidence & Reliability）"],"remember":["AI can help you find academic sources, but you need to verify, read and evaluate them before using them to support your work.","AI 可以帮你寻找学术资料，但文献是否真实、是否相关、能否支持你的论点，仍然需要你自己核实和判断。"]},{"title":["Keep, Change or Reject?","AI 的回答：保留、修改还是拒绝？"],"s":["You are learning about correlation and causation. You ask AI to explain the difference between them.\n\nAI responds:\n“When two variables are strongly correlated, it means that changes in one variable cause changes in the other.”","你正在学习相关关系（Correlation）和因果关系（Causation）的区别。\n\n你请 AI 解释这两个概念。\n\nAI 的回答：\n“当两个变量之间存在很强的相关关系时，就说明一个变量的变化会导致另一个变量发生变化。”"],"ask":["What should you do next?","面对这个解释，你应该怎么做？"],"options":[["Accept the explanation because a strong correlation indicates a causal relationship.","接受这个解释，因为高度相关就说明存在因果关系。"],["Ask AI to explain the same point in simpler language.","请 AI 用更简单的语言重新解释。"],["Question the explanation and check your module materials or other reliable sources to clarify the difference.","对这个解释提出质疑，并查阅课程资料或其他可靠来源，弄清两个概念的区别。"],["Use the explanation because it is clear and easy to understand.","这个解释很清楚，也容易理解，所以可以直接采用。"]],"correct":2,"feedback":[["A strong correlation does not necessarily mean that one variable causes changes in the other.","即使两个变量高度相关，也不能仅凭这一点就认定一个变量导致了另一个变量的变化。"],["A simpler explanation may be easier to understand, but it will not necessarily correct an inaccurate one.","更简单的语言也许能帮助你理解，但如果原来的观点就是错误的，换一种说法并不能解决问题。"],["Recommended. Correlation describes an association between variables, while causation concerns whether changes in one produce changes in the other. A strong correlation alone cannot establish causation.","相关关系（Correlation）描述的是变量之间的关联，而因果关系（Causation）涉及一个变量的变化是否导致另一个变量发生变化。即使相关性很强，也不能仅凭相关关系就认定存在因果关系。你需要进一步了解和核查。"],["An explanation can sound clear and convincing while still being incorrect. You need to check its accuracy.","一个解释即使清楚、易懂，甚至听起来很有说服力，也可能是错误的。理解了 AI 的回答，并不代表它一定正确。"]],"focus":["Overall quality judgement","综合质量判断"],"remember":["Understanding an AI explanation does not necessarily mean it is correct. Check important concepts against reliable learning materials.","能够理解 AI 的解释，不等于解释本身正确。遇到重要概念时，应该对照可靠的学习资料，检查其准确性。"]}];
const COPY={"en":{"section":"Learning with AI · Practice & Quizzes","eyebrow":"02 · While Working with AI","title":"Quality Check","intro":"An AI response may sound convincing without being accurate, relevant or useful for your learning.","introExtra":"Check three things: Direction — does it address your task? Expression — is it clear and appropriate? Meaning — does it make sense, preserve your intended meaning and support its claims?","intro2":"Choose an answer to see an explanation immediately, and try again if useful. For the wider approach to learning with AI, explore Chapter 7 of the book.","bookLink":"Explore the book and its wider learning approach","six":"6 everyday situations","instant":"Immediate feedback","retry":"Retry when needed","progress":"Question {n} of 6","count":"{n} completed","tag":"YOUR DECISION","correct":"Recommended choice","wrong":"Consider this","hint":"You can reconsider your answer or continue to the next question.","prev":"Previous","again":"Try again","next":"Next question","finish":"Finish & reflect","remember":"Remember","completeEyebrow":"QUALITY CHECK · COMPLETE","completeTitle":"What to Remember","take1":"A convincing AI response is not necessarily a good response.","take2":"AI can provide useful explanations, suggestions and evidence, but it can also miss the task, change your meaning or make unsupported claims. The judgement about what to trust, question or use remains yours.","stepTitle":"Your Next Step","step1":"Think of an AI response you have recently received, or return to one of the examples in this quiz.","step2":"Identify one thing you would keep, question or change, and explain why.","step3":"Before applying AI assistance to assessed work, check that it is permitted. Return to Boundary Check if you are unsure or the nature of the assistance changes. You can then explore Ownership Check.","actionPrompt":"Optional: Write down one judgement and your reason","placeholder":"I would keep, question or change… because…","privacy":"Your response stays in this browser page and may be lost when you refresh. It is not submitted or assessed.","restart":"Start again","copy":"Copy my reflection","back":"Return to Learning with AI","footer":"Studying in the UK · Learning with AI · Quality Check","copied":"Copied","quality":"Quality Check","boundary":"Boundary Check","ownership":"Ownership Check","bookChapter":"Chapter 7 — Learning in the AI Era: Boundaries, Judgement, and Ownership"},"zh":{"section":"与 AI 一起学习 · 练习与测验","eyebrow":"02 · 与 AI 合作时","title":"质量检查","intro":"AI 的回答可能听起来很有道理，但不一定准确、切题，也未必真正有助于你的学习。","introExtra":"使用 AI 时，可以从三个方面检查它的回答：\n方向（Direction）：是否真正回应了任务要求？\n表达（Expression）：是否清晰、准确、恰当？\n含义（Meaning）：内容是否合理？是否保留了你的原意？提出的观点是否有充分依据？","intro2":"选择答案后，你会立即看到相应的解释，也可以根据需要重新尝试。想进一步了解如何利用 AI 辅助学习，可以阅读本书第七章。","bookLink":"了解本书及更多学习方法","six":"6 个常见学习情境","instant":"即时反馈","retry":"可重复尝试","progress":"第 {n} 题，共 6 题","count":"已完成 {n} 题","tag":"你的选择","correct":"推荐答案","wrong":"再想一想","hint":"你可以重新选择，也可以继续下一题。","prev":"上一题","again":"再试一次","next":"下一题","finish":"完成并反思","remember":"小提示","completeEyebrow":"质量检查 · 已完成","completeTitle":"你需要记住的","take1":"AI 的回答即使听起来很有道理，也不一定是好的回答。","take2":"AI 可以帮助你解释概念、提供建议、寻找证据，但也可能偏离任务要求、改变你的原意，或提出缺乏依据的观点。哪些内容值得相信、哪些需要质疑、哪些可以采用，最终仍然需要你自己判断。","stepTitle":"试着运用你的判断","step1":"回想最近收到的一条 AI 回答，或者选择本次测验中的一个例子。","step2":"找出其中一项你会保留、质疑或修改的内容，并解释原因。","step3":"如果准备将 AI 的建议用于正式作业（Assessment），请先确认这种使用方式是否被允许。如果不确定，或者你使用 AI 的方式发生了变化，可以返回「边界检查（Boundary Check）」。之后，你还可以通过「所有权检查（Ownership Check）」进一步思考，如何真正理解并为自己的学习成果负责。","actionPrompt":"可选练习：写下你的判断和理由","placeholder":"我会保留、质疑或修改……因为……","privacy":"你的回答只会暂时保留在当前浏览器页面中，刷新页面后可能丢失。系统不会收集或评分。","restart":"重新开始","copy":"复制我的反思","back":"返回 Learning with AI","footer":"Studying in the UK · 与 AI 一起学习 · 质量检查","copied":"已复制","quality":"质量检查","boundary":"边界检查","ownership":"所有权检查","bookChapter":"第七章 — Learning in the AI Era: Boundaries, Judgement, and Ownership"}};
let lang='en',index=0;
let answers=Array(QUESTIONS.length).fill(null),revealed=Array(QUESTIONS.length).fill(false),solved=Array(QUESTIONS.length).fill(false);
const $=id=>document.getElementById(id), t=k=>COPY[lang][k], li=()=>lang==='en'?0:1;
function staticText(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});document.querySelectorAll('[data-i-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.iPlaceholder)});$('en').setAttribute('aria-pressed',String(lang==='en'));$('zh').setAttribute('aria-pressed',String(lang==='zh'));}
function render(){staticText();const q=QUESTIONS[index],count=solved.filter(Boolean).length;
$('progresslabel').textContent=t('progress').replace('{n}',index+1);$('countlabel').textContent=t('count').replace('{n}',count);$('fill').style.width=(count/QUESTIONS.length*100)+'%';$('progress').setAttribute('aria-valuenow',count);$('focus').textContent=q.focus[li()];$('qtitle').textContent=q.title[li()];$('situation').textContent=q.s[li()];$('ask').textContent=q.ask[li()];
$('options').replaceChildren();q.options.forEach((op,i)=>{let b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('aria-pressed',String(answers[index]===i));if(answers[index]===i)b.classList.add('selected');if(answers[index]===i&&i===q.correct)b.classList.add('correct');let letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];let content=document.createElement('span');content.textContent=op[li()];b.append(letter,content);b.addEventListener('click',()=>pick(i));$('options').append(b)});
$('feedback').classList.toggle('hidden',!revealed[index]);$('rememberBox').classList.toggle('hidden',!revealed[index]);$('rememberText').textContent=q.remember[li()];
if(revealed[index]){$('feedback').classList.toggle('wrong',answers[index]!==q.correct);$('feedbacktitle').textContent=answers[index]===q.correct?t('correct'):t('wrong');$('feedbackbody').textContent=q.feedback[answers[index]][li()];$('feedbackhint').textContent=answers[index]===q.correct?'':t('hint')}
$('prev').textContent=t('prev');$('prev').disabled=index===0;$('again').hidden=!revealed[index]||answers[index]===q.correct;$('again').textContent=t('again');$('next').textContent=index===QUESTIONS.length-1?t('finish'):t('next');$('next').disabled=!revealed[index]}
function pick(i){answers[index]=i;revealed[index]=true;if(i===QUESTIONS[index].correct)solved[index]=true;render();$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'});}
function showFinish(){staticText();$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('finish').focus();window.scrollTo({top:0,behavior:'smooth'})}
$('prev').onclick=()=>{if(index>0){index--;render()}};
$('next').onclick=()=>{if(index<QUESTIONS.length-1){index++;render();$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}else showFinish()};
$('again').onclick=()=>{answers[index]=null;revealed[index]=false;render()};
$('en').onclick=()=>{lang='en';$('finish').classList.contains('hidden')?render():staticText()};
$('zh').onclick=()=>{lang='zh';$('finish').classList.contains('hidden')?render():staticText()};
$('restart').onclick=()=>{index=0;answers.fill(null);revealed.fill(false);solved.fill(false);$('nextaction').value='';$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');render();$('quiz').scrollIntoView({behavior:'smooth'})};
$('copy').onclick=async()=>{const v=$('nextaction').value.trim();if(!v){$('nextaction').focus();return}try{await navigator.clipboard.writeText(v);$('copy').textContent=t('copied')}catch(e){$('nextaction').select();document.execCommand('copy');$('copy').textContent=t('copied')}};
render();</script></body></html>
