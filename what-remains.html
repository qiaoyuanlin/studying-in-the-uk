": "学习之后，你留下了什么？· 反思完成", "completeTitle": "接下来可以做什么？", "completeText": "你可以在另一项作业结束后再次进行反思，也可以阅读《Studying in the UK》中的 QRenewal Learning System，了解这五个方面。", "completeText2": "你也可以随时返回边界检查、质量检查或所有权检查。", "summary": "我的反思", "summary1": "回顾", "summary2": "今后可能用到的", "summary3": "我的下一步", "notWritten": "没有填写文字回答；不写也可以完成反思。", "links": "继续探索其他活动", "boundary": "边界检查", "quality": "质量检查", "ownership": "所有权检查", "bookChapter": "本书与 QRenewal Learning System", "footer": "Studying in the UK · 与 AI 一起学习 · 学习之后，你留下了什么？"}};
const TAILORED={"en":{"context":"Suggestions based on the options you selected—not an assessment of your written response or evidence of learning.","nochoice":"You have not selected an option. That is fine: choose an example below as a starting point, or return to the questions.","e1use":["You used AI to clarify something. A useful check is: can you now explain one key idea without opening the AI conversation?","You asked follow-up questions. Think of one answer that changed your understanding, and explain what changed.","You questioned or checked an AI suggestion. What evidence or reasoning helped you decide whether to trust it?","You compared suggestions. What mattered most in your decision: relevance, evidence or a different consideration?","Your ideas developed through the conversation. Identify one idea you changed and why you changed it.","You mainly used AI responses without much further checking. Try choosing one important claim and checking it against your module materials before using it again.","Your experience may not fit these categories. Think about one moment when you made a decision yourself."],"e1feel":["Feeling more confident can be helpful. Test whether that confidence matches what you can explain or do independently.","An explanation may feel easier to understand. Try explaining it in your own words with one example.","Enjoying the discussion can support engagement. Ask what idea or skill you actually gained from it.","If reliability concerned you, pick one important AI claim and check it against a trustworthy source.","If dependence concerned you, try an initial attempt without AI before asking for support.","If permission was unclear, check the specific assessment guidance before repeating that use.","Mixed feelings are worth noticing. What was useful, and what would you handle differently?"],"e1close":"These prompts suggest things to examine. They cannot tell whether your understanding improved. Exercise 2 asks what you might use again.","e2skill":["Explaining an idea: choose a concept from your last task, close the notes, and explain it in three sentences to a classmate or to yourself.","Checking information: find one claim in a new task, locate its original source and decide whether the source supports it.","Comparing ideas: take two possible explanations of a new problem, identify one strength and one limitation of each, then justify your preference.","Developing an argument: outline a new answer as claim → reason → evidence before asking AI to review it.","Using a method: try a similar but not identical problem independently, then check your steps against learning materials.","Asking questions: write one specific question about a new topic, including what you already understand and where you are stuck.","Not sure yet? Choose one small task you previously needed AI for, and try its first step unaided. Notice what is still difficult.","If you chose “something else”, name one action you took and imagine where you might need it again."],"e2close":"Recognising a possible skill is not the same as being able to use it. Try the example on a different task, and notice what you can do without the same assistance.","e3examples":[["Structure","Before my next assignment, I will underline the task words and write one sentence explaining what the question asks.","I will write a three-step plan for my next study session and begin with step one."],["Judgement","When AI offers an argument, I will identify one assumption and check whether the evidence supports it.","I will compare two possible explanations and write one reason for choosing one."],["Rhythm","I will study for 20 minutes at a planned time twice this week, then review what I completed.","At the end of my next study session, I will write down the first task for the following session."],["Collaboration","Before asking AI, I will write my own first attempt and then use AI to question one part of it, where permitted.","I will ask a classmate or tutor one specific question about something I cannot yet explain."],["Human Relationships","This week I will message one classmate to discuss a difficult topic or arrange a short study conversation.","I will identify one person or university support service I could contact when I need help."]],"e3pick":"Here are two starting points for your chosen area. You can adapt one or write your own; neither is a required answer.","e3empty":"If you are unsure what to choose, begin with whichever issue is making your next learning task most difficult. You can change your choice later.","e3close":"Choose a step small enough to attempt. After trying it, ask what happened and whether to keep or change the approach."},"zh":{"context":"以下建议根据你勾选的选项提供，并非对文字回答的评价，也不能证明你已学会某项能力。","nochoice":"你还没有选择选项，这也没关系。你可以先看看下面的例子，也可以返回题目再选择。","e1use":["你曾用 AI 澄清疑问。可以试一试：不打开 AI 对话，你现在能否解释其中一个关键概念？","你曾向 AI 追问。回想哪一个回答改变了你的理解，以及改变在哪里。","你曾质疑或核查 AI 的建议。哪些证据或理由帮助你判断它是否可信？","你曾比较不同建议。你作决定时最看重的是相关性、证据，还是其他因素？","你的想法在对话中有所发展。找出一个你修改过的观点，并说明原因。","你主要直接使用 AI 的回答而较少核查。下次可以挑一个重要论点，用课程资料核实后再采用。","你的经历可能不在这些类别中。回想一次由你自己作决定的时刻。"],"e1feel":["更有信心可能有帮助，但也可以检验这种信心是否与自己能独立解释或完成的事情相符。","觉得解释更容易理解以后，不妨用自己的话和一个例子再讲一次。","喜欢讨论有助于参与学习。再问问自己：实际获得了哪一个想法或技能？","如果担心可靠性，可挑选一个重要的 AI 论断，用可靠资料核查。","如果担心依赖，下一次可以先独立尝试，再寻求 AI 帮助。","如果不确定使用是否被允许，下次采用同类协助前先核查具体考核要求。","复杂的感受也值得留意。哪些部分有帮助？哪些做法下次想改变？"],"e1close":"这些提示只是帮助你进一步思考，无法判断你的理解是否提高。下一项练习会让你考虑哪些能力可能再次用得上。","e2skill":["解释概念：选一个刚学过的概念，合上笔记，试着用三句话向同学或自己解释。","核查信息：在新任务中找一个论断，查找原始来源，判断来源是否真的支持该论断。","比较观点：针对新问题找两种解释，分别写出一个优点和一个局限，再说明你的选择。","组织论证：面对新问题，先写出“主张 → 理由 → 证据”的简要提纲，再考虑是否请 AI 帮忙检查。","运用方法：独立尝试一个相似但不完全相同的问题，再用课程资料核对步骤。","提出问题：针对新主题写一个具体问题，说明你已理解什么、卡在哪里。","还不确定？找一项以前需要 AI 帮助的任务，先独立完成第一步，观察哪里还有困难。","如果选择“其他”，先说出你曾经采取的一项行动，再想想什么时候可能用得上。"],"e2close":"觉得自己可能具备某种能力，不等于已经能独立运用。尝试在不同的任务中使用它，留意不依靠同样 AI 协助时能做到什么。","e3examples":[["结构","下次开始作业前，我会圈出题目要求，并用一句话解释题目要我做什么。","下次学习前，我会写一个三步小计划，并立即开始第一步。"],["判断","当 AI 给出论点时，我会找出一个假设，并核查证据是否支持它。","我会比较两种解释，写下一条选择其中一种的理由。"],["节奏","这周我会安排两次各二十分钟的学习，并回顾实际完成了什么。","下次学习结束前，我会写下下一次开始时的第一项任务。"],["协作","在规则允许的情况下，我会先自己尝试，再让 AI 针对其中一个问题提出质疑。","我会向同学或导师提出一个关于尚未理解之处的具体问题。"],["人与人的关系","这周我会联系一位同学，讨论一个困难问题，或约一次简短的学习交流。","我会找出一位可以求助的人或学校支持服务，记下联系方式。"]],"e3pick":"下面是与你选择的方面相关的两个起点。可以修改后采用，也可以写自己的行动，并非标准答案。","e3empty":"如果暂时不知道选哪一项，可以从最妨碍你完成下一项任务的困难开始；之后也可以改变选择。","e3close":"选择一项足够小、能够实际尝试的行动。做完后，看看发生了什么，再决定保留或调整。"}};
let lang='en',step=0;
const feedbackSeen=[false,false,false];
// Answers are held in memory only; no remote submissions or browser storage.
const responses={checks1:[],checks2:[],reflect1:'',checks3:[],reflect2:'',focus:null,reflect3:''};
const $=id=>document.getElementById(id); const t=k=>COPY[lang][k];
function staticText(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('en').setAttribute('aria-pressed',String(lang==='en'));$('zh').setAttribute('aria-pressed',String(lang==='zh'));}
function makeCheckGroup(label,choices,key,radio=false){let fs=document.createElement('fieldset');fs.className='fieldset';const legend=document.createElement('legend');legend.textContent=label;fs.append(legend);const list=document.createElement('div');list.className='check-list'+(radio?' radio-list':'');choices.forEach((choice,i)=>{const lab=document.createElement('label');lab.className='check-item';const input=document.createElement('input');input.type=radio?'radio':'checkbox';input.name=key;input.value=String(i);input.checked=radio?responses[key]===i:responses[key].includes(i);input.addEventListener('change',()=>{if(radio)responses[key]=i;else if(input.checked){if(!responses[key].includes(i))responses[key].push(i)}else responses[key]=responses[key].filter(n=>n!==i);if(feedbackSeen[step])updateTailored()});const sp=document.createElement('span');if(radio){const title=document.createElement('span');title.className='choice-title';title.textContent=choice[0];const description=document.createElement('span');description.className='radio-description';description.textContent=choice[1];sp.append(title,description)}else sp.textContent=choice;lab.append(input,sp);list.append(lab)});fs.append(list);return fs;}
function makeText(label,key,placeholder,help){const box=document.createElement('div');box.className='open-answer';const id='text-'+key;const lab=document.createElement('label');lab.htmlFor=id;lab.textContent=label+' '+t('optional');const ta=document.createElement('textarea');ta.id=id;ta.rows=4;ta.placeholder=placeholder;ta.value=responses[key];ta.addEventListener('input',()=>responses[key]=ta.value);box.append(lab,ta);if(help){const p=document.createElement('p');p.className='helper';p.textContent=help;box.append(p)}return box;}
function updateTailored(){
 const wrap=$('tailoredFeedback');wrap.replaceChildren();
 const data=TAILORED[lang];
 function para(value,cls='tailored-item'){const p=document.createElement('p');p.className=cls;p.textContent=value;wrap.append(p);}
 para(data.context,'tailored-note');
 if(step===0){
   const used=responses.checks1.slice().sort((a,b)=>a-b);
   const felt=responses.checks2.slice().sort((a,b)=>a-b);
   if(!used.length&&!felt.length)para(data.nochoice);
   // Show at most two use prompts and two experience prompts so this stays readable.
   used.slice(0,2).forEach(i=>para(data.e1use[i]));
   felt.slice(0,2).forEach(i=>para(data.e1feel[i]));
   if(used.length>2||felt.length>2)para(lang==='en'?'You selected several experiences. Focus first on the two that matter most to you.':'你选择了多种经历。先挑其中最重要的两项思考。');
   para(data.e1close);
 }else if(step===1){
   const skills=responses.checks3.slice().sort((a,b)=>a-b);
   if(!skills.length)para(data.nochoice);
   skills.slice(0,2).forEach(i=>para(data.e2skill[i]));
   if(skills.length>2)para(lang==='en'?'You selected several possibilities. Try just one or two before adding more.':'你选择了多种可能的能力。先尝试其中一两项即可。');
   para(data.e2close);
 }else{
   if(responses.focus===null){para(data.e3empty)}else{
     para(data.e3pick);
     const examples=data.e3examples[responses.focus];
     examples.slice(1).forEach((v,i)=>para((i+1)+'. '+v));
   }
   para(data.e3close);
 }
}
function render(){staticText();$('exercise').classList.remove('hidden');$('finishPage').classList.add('hidden');$('progresslabel').textContent=t('progress').replace('{n}',step+1);$('countlabel').textContent=t('count');$('progress').setAttribute('aria-valuenow',step+1);$('fill').style.width=(step+1)/3*100+'%';const p='e'+(step+1);$('exTitle').textContent=t(p+'title');$('exIntro').textContent=t(p+'intro');const f=$('fields');f.replaceChildren();if(step===0){f.append(makeCheckGroup(t('e1q1'),t('e1options1'),'checks1'),makeCheckGroup(t('e1q2'),t('e1options2'),'checks2'),makeText(t('e1q3'),'reflect1',t('e1placeholder'),t('e1help')))}else if(step===1){f.append(makeCheckGroup(t('e2q1'),t('e2options'),'checks3'),makeText(t('e2q2'),'reflect2',t('e2placeholder'),t('e2help')))}else{f.append(makeCheckGroup(t('e3q1'),t('e3options'),'focus',true));const h=document.createElement('h3');h.textContent=t('e3q2');f.append(h,makeText(t('e3prompt'),'reflect3',t('e3placeholder'),t('e3help')))}for(let i=1;i<=3;i++)$('take'+i).textContent=t(p+'take'+i)||'';updateTailored();$('exerciseFeedback').classList.toggle('hidden',!feedbackSeen[step]);$('prev').textContent=t('prev');$('prev').disabled=step===0;$('next').textContent=feedbackSeen[step]?(step===2?t('finish'):t('next')):t('showFeedback');}
function showFinish(){staticText();$('exercise').classList.add('hidden');$('finishPage').classList.remove('hidden');$('response1').textContent=responses.reflect1.trim()||t('notWritten');$('response2').textContent=responses.reflect2.trim()||t('notWritten');const v=responses.reflect3.trim();$('response3').textContent=(responses.focus===null?'':t('e3options')[responses.focus][0]+(v?' — ':''))+(v||(!Number.isInteger(responses.focus)?t('notWritten'):''));$('copyStatus').textContent='';$('finishPage').focus();$('finishPage').scrollIntoView({block:'start',behavior:'smooth'});}
$('prev').addEventListener('click',()=>{if(step>0){step--;render();$('exercise').scrollIntoView({block:'start',behavior:'smooth'})}});$('next').addEventListener('click',()=>{if(!feedbackSeen[step]){feedbackSeen[step]=true;render();$('exerciseFeedback').focus();$('exerciseFeedback').scrollIntoView({block:'nearest',behavior:'smooth'});return;}if(step<2){step++;render();$('exercise').scrollIntoView({block:'start',behavior:'smooth'})}else showFinish()});
for(const language of ['en','zh'])$(language).addEventListener('click',()=>{lang=language;if($('finishPage').classList.contains('hidden'))render();else showFinish()});
$('restart').addEventListener('click',()=>{feedbackSeen.fill(false);step=0;responses.checks1=[];responses.checks2=[];responses.reflect1='';responses.checks3=[];responses.reflect2='';responses.focus=null;responses.reflect3='';render();$('exercise').scrollIntoView({block:'start',behavior:'smooth'})});
$('copy').addEventListener('click',async()=>{const output=[[t('summary1'),responses.reflect1.trim()],[t('summary2'),responses.reflect2.trim()],[t('summary3'),(responses.focus===null?'':t('e3options')[responses.focus][0]+'\n')+responses.reflect3.trim()]].filter(x=>x[1]).map(x=>x[0]+'\n'+x[1]).join('\n\n');if(!output){$('copyStatus').textContent=t('empty');return}try{await navigator.clipboard.writeText(output);$('copyStatus').textContent=t('copied')}catch(e){$('copyStatus').textContent=t('copyfail')}});
render();</script></body></html>
