t:space-between;gap:15px;color:var(--muted);font-size:13px;font-weight:600}.track{height:7px;background:var(--soft);border-radius:20px;overflow:hidden;margin:13px 0 30px}.fill{height:100%;width:0;background:var(--green);transition:width .2s}.question-tag{font-size:12px;letter-spacing:1.1px;color:var(--green);font-weight:700;text-transform:uppercase}.situation{white-space:pre-line;margin:16px 0 20px;max-width:730px}.ask{font-weight:700;color:var(--navy);margin:0 0 16px}.options{display:grid;gap:11px}.option{display:flex;text-align:left;gap:14px;align-items:flex-start;border:1px solid #d7e2df;background:white;border-radius:7px;padding:15px 17px;color:var(--ink);width:100%;transition:border-color .12s,background .12s}.option:hover:not(:disabled){border-color:var(--green);background:#f7faf8}.letter{width:27px;height:27px;flex-shrink:0;display:grid;place-items:center;border:1px solid #d0dbd9;border-radius:50%;color:var(--navy);font-weight:700;font-size:12px}.option.selected{border:2px solid var(--navy);padding:14px 16px;background:#f6f8f9}.option.correct{border-color:#54766d;background:#f1f6f3}.feedback{margin-top:24px;padding:20px 22px;background:var(--soft);border-left:4px solid var(--green);border-radius:3px}.feedback.wrong{border-left-color:#a77a47;background:#fbf7f0}.feedback h3{font-family:inherit;font-size:17px;font-weight:700;margin:0 0 6px}.feedback p{margin:0}.feedback small{display:block;margin-top:10px;color:var(--muted)}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:27px;align-items:center}.btn{border:1px solid #c5d5d0;background:white;color:var(--navy);border-radius:5px;padding:11px 21px;font-size:14px;font-weight:650}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.primary:hover{background:var(--green);border-color:var(--green)}.btn:hover{background:var(--soft)}.quiet{font-size:13px;color:var(--muted)}.completion p{max-width:740px}.takeaway{background:var(--soft);padding:18px 22px;border-left:3px solid var(--green);margin-top:24px}.takeaway p{margin:7px 0}.reflection{margin-top:23px}.reflection label{font-weight:650;display:block;margin-bottom:9px;color:var(--navy)}textarea{width:100%;min-height:100px;padding:13px;border:1px solid #c5d4d0;border-radius:6px;resize:vertical;color:var(--ink);background:white}footer{background:var(--navy-dark);color:#d5e0e5;padding:25px 0;font-size:12px}.hidden{display:none!important}@media(max-width:600px){.masthead-in{align-items:flex-start;flex-direction:column;padding:14px 0;gap:6px}.hero{padding:32px 0}.panel{padding:19px}.option{padding:13px}.option.selected{padding:12px}h2{font-size:25px}.btn{flex:1 1 130px}}

.fieldset{border:0;margin:18px 0 23px;padding:0;min-width:0}.fieldset legend{font-weight:700;color:var(--navy);padding:0;margin-bottom:13px}.check-list{display:grid;gap:10px}.check-item{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);padding:12px 14px;border-radius:7px;background:#fff;cursor:pointer}.check-item:hover{background:var(--soft)}.check-item input{accent-color:var(--green);width:19px;height:19px;margin:3px 0 0;flex-shrink:0}.check-item span{flex:1}.radio-list .check-item:has(input:checked),.check-item:has(input:checked){background:#f1f6f3;border-color:var(--green)}.open-answer{margin:20px 0 22px}.open-answer label{font-weight:700;display:block;color:var(--navy);margin:0 0 8px}.helper{color:var(--muted);font-size:13px;margin:8px 0 0}.takeaway-inline{background:#f4f7f6;border-left:3px solid var(--green);padding:17px 20px;margin-top:23px}.takeaway-inline h3{font:700 16px 'Segoe UI',Arial,sans-serif;margin:0 0 7px}.takeaway-inline p{margin:0 0 9px}.takeaway-inline p:last-child{margin:0}.tailored-item{margin:9px 0;padding-left:12px;border-left:2px solid #cadbd4}.tailored-note{font-size:13px;color:var(--muted)}.optional-tag{font-size:13px;color:var(--muted);font-weight:400}.radio-description{display:block;color:var(--muted);font-size:14px;margin-top:3px}.choice-title{font-weight:650;color:var(--navy)}.completion .reflection{margin-top:20px}.save-note{font-size:13px;color:var(--muted);margin-top:15px}.buttons .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}@media(max-width:600px){.check-item{padding:11px}.fieldset{margin-top:16px}}

<script>const COPY={"en":{"section":"Learning with AI · Practice & Quizzes","eyebrow":"04 · After you finish","title":"What Remains with You?","intro":"Think about an assignment or project you have completed with AI assistance.","introExtra":"You have finished the work, but what have you learned from the process? What can you now explain, understand or do yourself?","intro2":"Through three short exercises, explore what you have learned, try using it in a different situation and identify what you could improve next. This is a learning activity, not a test of your ability or whether your work was acceptable for submission. There are no scores or marked answers.","bookLink":"Explore the book and its wider learning approach","chip1":"3 reflection exercises","chip2":"No scoring","chip3":"Learn at your own pace","progress":"Exercise {n} of 3","count":"Reflection · no scores","prev":"Previous exercise","showFeedback":"View reflection feedback","next":"Next exercise","finish":"Finish my reflection","restart":"Start again","copy":"Copy my reflection","copied":"Copied","copyfail":"Could not copy. Please select your text manually.","empty":"Write something first if you would like to copy your reflection.","privacy":"Your responses remain in this browser page and may be lost if you refresh or close it. They are not submitted or assessed.","takeaway":"What to Take Away","optional":"(optional)","textboxPrompt":"Your response (optional)","textboxPlaceholder":"You can write a sentence here…","return":"Return to Learning with AI","e1title":"Looking Back — How Did You Work with AI?","e1intro":"Think about an assignment or project you completed with AI assistance.","e1q1":"1. How did you work with AI? Select any that apply.","e1options1":["I asked AI to explain something I did not understand.","I asked follow-up questions to explore ideas further.","I checked or questioned something AI suggested.","I compared different suggestions before deciding what to use.","I changed or developed my ideas through conversations with AI.","I mainly used AI’s responses without much further discussion or checking.","Something else."],"e1q2":"2. What was your experience like? Select any that apply.","e1options2":["AI helped me feel more confident.","AI made difficult ideas easier to understand.","I enjoyed exploring ideas with AI.","I was sometimes unsure whether AI’s responses were reliable.","I worried about relying too much on AI.","I was unsure whether my use of AI was allowed.","I had mixed feelings or a different experience."],"e1q3":"3. Looking back, is there anything you would like to do differently next time?","e1placeholder":"Next time, I would like to…","e1help":"You can write a sentence or simply think about your answer.","e1take1":"Your experience of working with AI may include useful support, difficult decisions, uncertainty or changes in your thinking.","e1take2":"Asking questions, checking suggestions and considering alternatives can help you take a more active role in your learning. But simply doing these things does not guarantee that you have understood or learned something.","e1take3":"The important question is what you gained from the experience. In the next exercise, you will try using something you have learned in a different situation.","e2title":"Application — What Could You Use Again?","e2intro":"Think about the assignment or project you completed with AI assistance. Beyond the completed work, you may have gained knowledge, skills or ways of thinking that could help you in the future.","e2q1":"1. Looking back, which of these might you have learned or improved? Select any that apply.","e2options":["Understanding and explaining a difficult idea.","Finding and checking useful information.","Comparing different ideas or explanations.","Organising my thoughts and developing an argument.","Solving a problem or using a method.","Asking clearer questions and exploring ideas further.","I am not sure yet.","Something else."],"e2q2":"2. Could any of these be useful in another assignment, project or everyday situation?","e2help":"Think about where you might use them again. You do not need to have another example in mind already.","e2placeholder":"Something I might use again is…","e2take1":"Completing an assignment is one achievement. Recognising what you have learned from the process is another.","e2take2":"You may not immediately know what knowledge or skills you have gained, or where you could use them again. That is normal.","e2take3":"As you encounter new tasks and situations, notice whether something you learned before can help you. This is how you can begin to recognise what remains with you beyond the completed work.","e3title":"Next Step — What Do I Need to Strengthen?","e3intro":"You have looked back at how you worked with AI and considered what you might have learned from the experience. Now think about your next assignment or learning task.","e3q1":"Which of the following would help you most with your learning? Choose one that feels most useful to you now. There is no correct answer.","e3options":[["Structure — Getting organised","I would like to understand my tasks better, plan my work or know what to do next."],["Judgement — Making better decisions","I would like to become better at questioning information, comparing ideas and explaining my choices."],["Rhythm — Learning regularly","I would like to develop a manageable study routine and keep making progress."],["Collaboration — Learning with others and AI","I would like to make better use of AI, feedback and discussions to develop my understanding."],["Human Relationships — Staying connected","I would like to have people I can share my experiences with, whether things are going well or I am finding them difficult."]],"e3q2":"My Next Step","e3prompt":"What is one small thing you could do to improve this area?","e3placeholder":"Next time, I will try to…","e3help":"Choose something practical that you could begin with your next study session or assignment.","e3take1":"You do not need to improve everything at once.","e3take2":"Recognising what you have learned and what you would like to strengthen is a useful starting point. Try one small change, notice what happens and adjust your approach as you learn.","completeEyebrow":"WHAT REMAINS WITH YOU? · REFLECTION COMPLETE","completeTitle":"Where Next?","completeText":"You can revisit this reflection after another assignment or explore the QRenewal Learning System in Studying in the UK to learn more about these five areas.","completeText2":"You can also return to Boundary Check, Quality Check or Ownership Check whenever useful.","summary":"Your Reflection","summary1":"Looking back","summary2":"What I might use again","summary3":"My next step","notWritten":"No written response — you can still finish this reflection without writing.","links":"Explore other learning activities","boundary":"Boundary Check","quality":"Quality Check","ownership":"Ownership Check","bookChapter":"The book and QRenewal Learning System","footer":"Studying in the UK · Learning with AI · What Remains with You?"},"zh":{"section":"与 AI 一起学习 · 练习与测验","eyebrow":"04 · 完成任务之后","title":"学习之后，你真正学到了什么？","intro":"回想一份你曾借助 AI 完成的作业（Assignment）或项目。","introExtra":"作业完成了，但你从中学到了什么？现在有哪些知识、方法或技能，是你不依赖同样的 AI 帮助，也能自己理解、解释或运用的？","intro2":"通过三个简短的练习，回顾你的学习经历，想一想哪些收获以后还能用得上，以及下一步可以改进什么。\n\n这是一项帮助你反思学习的活动，不用于评估你的能力，也不能判断作业是否符合提交要求。这里没有分数，也没有标准答案。","bookLink":"了解本书及更多学习方法","chip1":"3 项反思练习","chip2":"不评分","chip3":"按自己的节奏完成","progress":"第 {n} 项练习，共 3 项","count":"学习反思 · 不评分","prev":"上一项练习","showFeedback":"查看反思提示","next":"下一项练习","finish":"完成我的反思","restart":"重新开始","copy":"复制我的反思","copied":"已复制","copyfail":"复制失败，请手动选择并复制文字。","empty":"请先写下一些反思内容，再进行复制。","privacy":"你的回答只保留在当前浏览器页面，不会上传或评分。刷新或关闭页面后，内容可能丢失。","takeaway":"值得记住","optional":"（可选）","textboxPrompt":"我的回答（可选）","textboxPlaceholder":"可以在这里写下一句话……","return":"返回 Learning with AI","e1title":"回顾：你是怎样与 AI 一起学习的？","e1intro":"想一想你曾借助 AI 完成的一份作业或项目。","e1q1":"1. 你当时是怎样使用 AI 的？（可多选）","e1options1":["我请 AI 解释自己不理解的内容。","我通过不断追问，进一步理解和探索问题。","我检查过 AI 的回答，也曾质疑它的建议。","我比较过不同建议，再决定采用哪一种。","通过与 AI 对话，我改变或进一步发展了自己的想法。","我基本上直接采用 AI 的回答，没有进行太多讨论或核查。","其他情况。"],"e1q2":"2. 在这个过程中，你有哪些感受或体验？（可多选）","e1options2":["AI 让我对完成任务更有信心。","AI 帮助我更容易理解原本觉得困难的概念。","我喜欢通过与 AI 对话来探索不同的想法。","有时候，我不确定 AI 的回答是否准确可靠。","我有些担心自己会过度依赖 AI。","我不太确定自己的 AI 使用方式是否符合学校规定。","我的感受比较复杂，或者有其他体验。"],"e1q3":"3. 回头想想，下次有没有什么你想换一种方式来做？","e1placeholder":"下次，我想试着……","e1help":"你可以写下一句话，也可以先在心里想一想。","e1take1":"与 AI 一起学习，可能让你获得有用的帮助，也可能让你遇到一些困难、疑问，甚至改变原来的想法。","e1take2":"主动提问、检查 AI 的建议、比较不同的选择，都有助于你更积极地参与学习。但这些行为本身，并不代表你一定理解了内容，或者已经掌握了相关能力。","e1take3":"更值得思考的是：经过这次学习，你究竟收获了什么？在下一项练习中，我们将进一步想一想，哪些收获可能在其他任务中继续派上用场。","e2title":"应用：学到的东西，以后还能用吗？","e2intro":"回想你借助 AI 完成的那份作业或项目。\n\n除了完成任务，你也可能在过程中学到了一些知识、技能或思考问题的方法。这些收获，也许以后还能用得上。","e2q1":"1. 回头想想，你觉得自己可能学到了什么，或者在哪些方面有所提高？（可多选）","e2options":["理解并解释比较困难的概念。","查找信息，并判断信息是否可靠、有用。","比较不同的观点或解释。","整理思路，并逐步形成自己的论证。","解决问题，或者学会运用某种方法。","提出更清楚的问题，并进一步探索。","我现在还不太确定。","其他方面。"],"e2q2":"2. 你觉得其中哪些知识或能力，以后还能用在其他作业、项目或日常生活中？","e2placeholder":"以后，我可能还会用到……","e2help":"想一想这些收获可以在哪些情况下派上用场。如果现在还想不到具体例子，也没有关系。","e2take1":"完成一份作业是一种收获。能够发现自己在过程中学到了什么，也是一种重要的收获。","e2take2":"你可能暂时还说不清自己究竟学到了哪些知识或技能，也不知道以后能在哪里用到。这很正常。","e2take3":"下次遇到新的任务或问题时，留意一下：以前学到的知识和方法，能不能帮助你应对眼前的情况？通过一次次尝试，你会逐渐发现，除了完成的作业，还有什么真正留在了自己身上。","e3title":"下一步：我还可以在哪些方面进步？","e3intro":"你已经回顾了自己与 AI 一起学习的经历，也想过可能从中获得了什么。\n\n现在，把目光转向下一份作业或下一个学习任务。","e3q1":"目前，你最想在哪一方面有所提高？请选择现在对你最有帮助的一项。这里没有标准答案。","e3options":[["结构（Structure）— 更有条理地学习","我希望能够更好地理解任务要求、安排学习计划，并知道下一步该做什么。"],["判断（Judgement）— 学会作出更好的判断","我希望能够更好地质疑信息、比较不同观点，并说明自己为什么作出某种选择。"],["节奏（Rhythm）— 保持稳定的学习习惯","我希望找到适合自己的学习节奏，能够坚持学习，并逐步取得进展。"],["协作（Collaboration）— 善用他人和 AI 的帮助","我希望更有效地利用 AI、老师的反馈以及与同学的讨论，帮助自己加深理解。"],["人际联系（Human Relationships）— 与他人保持联系","无论学习顺利还是遇到困难，我都希望有人可以交流、分享经历，并在需要时获得支持。"]],"e3q2":"我的下一步","e3prompt":"为了在这一方面有所进步，你现在可以尝试做的一件小事是什么？","e3placeholder":"下次，我会试着……","e3help":"尽量选择一件具体、容易开始的事情，最好在下一次学习或完成作业时就能尝试。","e3take1":"你不需要一次改变所有事情。","e3take2":"发现自己已经学到了什么，还有哪些方面需要加强，就是一个很好的开始。先尝试一个小改变，看看效果如何，再根据自己的经历决定是继续保持，还是调整做法。","completeEyebrow":"What Remains with You? · 反思完成","completeTitle":"接下来，你可以做什么？","completeText":"完成下一份作业或项目后，你可以再次回到这里，看看自己的学习有没有新的变化。你也可以阅读《Studying in the UK》中的 QRenewal Learning System，进一步了解结构、判断、节奏、协作与人际联系这五个方面。","completeText2":"如果需要，你也可以随时返回 Boundary Check、Quality Check 或 Ownership Check，重新思考自己与 AI 一起学习的方式。","summary":"我的学习反思","summary1":"回顾学习经历","summary2":"以后可能用得上的收获","summary3":"我的下一步","notWritten":"你没有填写文字回答。没关系，不写也可以完成反思。","links":"继续探索其他学习活动","boundary":"Boundary Check · 边界检查","quality":"Quality Check · 质量检查","ownership":"Ownership Check · 我的作业，我真的掌握了吗？","bookChapter":"了解本书与 QRenewal Learning System","footer":"Studying in the UK · Learning with AI · What Remains with You?"}};
const TAILORED={"en":{"context":"Suggestions based on the options you selected—not an assessment of your written response or evidence of learning.","nochoice":"You have not selected an option. That is fine: choose an example below as a starting point, or return to the questions.","e1use":["You used AI to clarify something. A useful check is: can you now explain one key idea without opening the AI conversation?","You asked follow-up questions. Think of one answer that changed your understanding, and explain what changed.","You questioned or checked an AI suggestion. What evidence or reasoning helped you decide whether to trust it?","You compared suggestions. What mattered most in your decision: relevance, evidence or a different consideration?","Your ideas developed through the conversation. Identify one idea you changed and why you changed it.","You mainly used AI responses without much further checking. Try choosing one important claim and checking it against your module materials before using it again.","Your experience may not fit these categories. Think about one moment when you made a decision yourself."],"e1feel":["Feeling more confident can be helpful. Test whether that confidence matches what you can explain or do independently.","An explanation may feel easier to understand. Try explaining it in your own words with one example.","Enjoying the discussion can support engagement. Ask what idea or skill you actually gained from it.","If reliability concerned you, pick one important AI claim and check it against a trustworthy source.","If dependence concerned you, try an initial attempt without AI before asking for support.","If permission was unclear, check the specific assessment guidance before repeating that use.","Mixed feelings are worth noticing. What was useful, and what would you handle differently?"],"e1close":"These prompts suggest things to examine. They cannot tell whether your understanding improved. Exercise 2 asks what you might use again.","e2skill":["Explaining an idea: choose a concept from your last task, close the notes, and explain it in three sentences to a classmate or to yourself.","Checking information: find one claim in a new task, locate its original source and decide whether the source supports it.","Comparing ideas: take two possible explanations of a new problem, identify one strength and one limitation of each, then justify your preference.","Developing an argument: outline a new answer as claim → reason → evidence before asking AI to review it.","Using a method: try a similar but not identical problem independently, then check your steps against learning materials.","Asking questions: write one specific question about a new topic, including what you already understand and where you are stuck.","Not sure yet? Choose one small task you previously needed AI for, and try its first step unaided. Notice what is still difficult.","If you chose “something else”, name one action you took and imagine where you might need it again."],"e2close":"Recognising a possible skill is not the same as being able to use it. Try the example on a different task, and notice what you can do without the same assistance.","e3examples":[["Structure","Before my next assignment, I will underline the task words and write one sentence explaining what the question asks.","I will write a three-step plan for my next study session and begin with step one."],["Judgement","When AI offers an argument, I will identify one assumption and check whether the evidence supports it.","I will compare two possible explanations and write one reason for choosing one."],["Rhythm","I will study for 20 minutes at a planned time twice this week, then review what I completed.","At the end of my next study session, I will write down the first task for the following session."],["Collaboration","Before asking AI, I will write my own first attempt and then use AI to question one part of it, where permitted.","I will ask a classmate or tutor one specific question about something I cannot yet explain."],["Human Relationships","This week I will message one classmate to discuss a difficult topic or arrange a short study conversation.","I will identify one person or university support service I could contact when I need help."]],"e3pick":"Here are two starting points for your chosen area. You can adapt one or write your own; neither is a required answer.","e3empty":"If you are unsure what to choose, begin with whichever issue is making your next learning task most difficult. You can change your choice later.","e3close":"Choose a step small enough to attempt. After trying it, ask what happened and whether to keep or change the approach."},"zh":{"context":"以下建议是根据你选择的选项提供的，目的是帮助你进一步思考。这些提示不会分析或评价你填写的文字，也不能证明你已经掌握了某项知识或能力。","nochoice":"你还没有选择任何选项，这也没关系。你可以先看看下面的例子，或者返回题目，选择最符合自己经历的选项。","e1use":["你曾请 AI 帮助解释不理解的内容。不妨现在试一试：不看 AI 的回答，你还能用自己的话解释其中一个重要概念吗？","你曾通过追问进一步探索问题。回想一下，哪一次追问让你对问题有了新的理解？你的想法发生了什么变化？","你曾检查或质疑 AI 的建议。想一想，当时你是根据什么来判断的？哪些证据或理由让你相信，或者怀疑它的回答？","你曾比较不同的建议。回想一下，最后为什么选择其中一种？是因为它更符合任务要求、证据更充分，还是有其他原因？","你曾通过与 AI 对话进一步发展自己的想法。试着找出一个你改变过的观点，想想自己为什么会改变。","你提到自己比较直接地采用 AI 的回答，没有进行太多核查。下次可以先挑选一个重要观点，对照课程资料或可靠来源检查，再决定是否采用。","你的经历可能与上面的选项不太一样。不妨回想一次与 AI 合作的过程：其中有没有什么事情，是你自己考虑后作出决定的？"],"e1feel":["AI 让你更有信心，这是积极的体验。不过，也可以进一步看看：这种信心是否来自自己真正理解了内容，或者已经能够独立完成某些事情？","AI 让困难的概念变得容易理解。现在不妨试着用自己的话，再加上一个例子，把这个概念解释一遍。","你喜欢与 AI 一起讨论问题。这样的交流可以让学习更有趣。不过，也值得问问自己：经过讨论，你究竟获得了什么新的理解或能力？","如果不确定 AI 的回答是否可靠，可以选一个重要观点，尝试用课程资料、原始文献或其他可靠来源进行核查。","如果担心过度依赖 AI，下次遇到问题时，可以先独立尝试一会儿，再决定是否需要 AI 帮助。","如果不确定某种 AI 使用方式是否符合规定，下次使用类似帮助前，先查看具体的作业要求和学校的 AI 使用政策。","对 AI 有复杂的感受很正常。不妨想想：哪些帮助对你真正有用？哪些地方让你不太满意？下次有什么想换一种方式来做？"],"e1close":"这些提示只是帮助你进一步回顾学习经历，并不能判断你的理解或能力是否已经提高。接下来，想一想：在与 AI 一起学习的过程中，有哪些东西可能成为你以后还能用得上的知识或能力？","e2skill":["理解和解释概念：选择一个刚学过的概念，先不看笔记，试着用三句话向同学或自己解释清楚。","查找和核查信息：在新的学习任务中，找一个需要证据支持的观点，查找原始资料，看看这些资料是否真的支持这一观点。","比较不同观点：面对一个新问题，找出两种不同的解释。分别想想它们的优点和局限，再说明你更支持哪一种，以及为什么。","组织思路和发展论证：面对一个新的作业题目，先试着按照“主张 → 理由 → 证据”的顺序列出简单提纲，再考虑是否需要 AI 帮助检查。","解决问题和运用方法：找一个与之前学过的内容相似、但又不完全相同的问题，先独立尝试，再对照课程资料检查自己的方法和步骤。","提出更好的问题：面对一个新主题，试着写下一个具体问题。先说明自己已经理解了什么，再指出还有哪里不明白。","暂时还不确定：如果还不清楚自己学到了什么，可以找一项以前需要 AI 帮助才能完成的任务，先独立尝试第一步，看看哪些地方已经能够自己完成，哪些地方仍有困难。","其他能力：如果你选择了“其他方面”，可以先回想自己曾经采取的一项具体行动，再想想：以后在什么情况下，你可能还会用到它？"],"e2close":"觉得自己可能学会了某种方法，不等于已经能够独立运用。不妨在不同的任务中尝试使用它，看看在没有同样 AI 帮助的情况下，自己能够完成什么。","e3examples":[["结构（Structure）","下次开始写作业前，我会先找出题目中的关键要求，再用一句话说明这份作业究竟要我做什么。","下次开始学习前，我会列出一个简单的三步计划，然后马上开始第一步。"],["判断（Judgement）","下次 AI 提出一个论点时，我会先想想它建立在哪些假设上，再检查证据是否支持这些假设。","我会试着比较两种不同的解释，并写下一条自己选择其中一种的理由。"],["节奏（Rhythm）","这周我会安排两次各二十分钟的学习，之后看看自己实际完成了什么。","每次学习结束前，我会写下下一次学习要做的第一件事，让自己更容易开始。"],["协作（Collaboration）","在学校规定允许的情况下，我会先独立尝试，再请 AI 针对其中一个问题提出不同观点或质疑。","我会向同学或老师提出一个具体问题，讨论自己还没有真正理解的地方。"],["人际联系（Human Relationships）","这周我会联系一位同学，讨论一个学习中遇到的问题，或者约一次简短的学习交流。","我会了解学校有哪些学习或学生支持服务，并记下一个以后需要帮助时可以联系的渠道。"]],"e3pick":"下面是与你所选方面相关的两个行动示例。你可以直接采用，也可以根据自己的情况修改，或者提出完全不同的行动。这些都不是标准答案。","e3empty":"如果暂时不知道应该选择哪一项，可以先想想：目前最影响你完成下一项学习任务的困难是什么？从那里开始就可以了。以后也可以根据实际情况调整。","e3close":"先选择一件具体、能够做到的小事。尝试之后，再回头看看发生了什么：哪些方法有帮助？哪些地方还需要调整？"}};
let lang='en',step=0;
const feedbackSeen=[false,false,false];
// Answers are held in memory only; no remote submissions or browser storage.
const responses={checks1:[],checks2:[],reflect1:'',checks3:[],reflect2:'',focus:null,reflect3:''};
const $=id=>document.getElementById(id); const t=k=>COPY[lang][k];
function staticText(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('en').setAttribute('aria-pressed',String(lang==='en'));$('zh').setAttribute('aria-pressed',String(lang==='zh'));}
function makeCheckGroup(label,choices,key,radio=false){let fs=document.createElement('fieldset');fs.className='fieldset';const legend=document.createElement('legend');legend.textContent=label;fs.append(legend);const list=document.createElement('div');list.className='check-list'+(radio?' radio-list':'');choices.forEach((choice,i)=>{const lab=document.createElement('label');lab.className='check-item';const input=document.createElement('input');input.type=radio?'radio':'checkbox';input.name=key;input.value=String(i);input.checked=radio?responses[key]===i:responses[key].includes(i);input.addEventListener('change',()=>{if(radio)responses[key]=i;else if(input.checked){if(!responses[key].includes(i))responses[key].push(i)}else responses[key]=responses[key].filter(n=>n!==i);if(feedbackSeen[step])updateTailored()});const sp=document.createElement('span');if(radio){const title=document.createElement('span');title.className='choice-title';title.textContent=choice[0];const description=document.createElement('span');description.className='radio-description';description.textContent=choice[1];sp.append(title,description)}else sp.textContent=choice;lab.append(input,sp);list.append(lab)});fs.append(list);return fs;}
function makeText(label,key,placeholder,help){const box=document.createElement('div');box.className='open-answer';const id='text-'+key;const lab=document.createElement('label');lab.htmlFor=id;lab.textContent=label+' '+t('optional');const ta=document.createElement('textarea');ta.id=id;ta.rows=4;ta.placeholder=placeholder;ta.value=responses[key];ta.addEventListener('input',()=>responses[key]=ta.value);box.append(lab,ta);if(help){const p=document.createElement('p');p.className='helper';p.textContent=help;box.append(p)}return box;}
function updateTailored(){
 const wrap=$('tailoredFeedback');wrap.replaceChildren();
 const data=TAILORED[lang];
 function para(value,cls='tailored-item'){const p=document.createElement('p');p.className=cls;p.textContent=value;wrap.append(p);}
 para(data.context,'tailored-note');
 if(step===0){
   const used=responses.checks1.slice().sort((a,b)=>a-b);
   const felt=responses.checks2.slice().sort((a,b)=>a-b);
   if(!used.length&&!felt.length)para(data.nochoice);
   // Show at most two use prompts and two experience prompts so this stays readable.
   used.slice(0,2).forEach(i=>para(data.e1use[i]));
   felt.slice(0,2).forEach(i=>para(data.e1feel[i]));
   if(used.length>2||felt.length>2)para(lang==='en'?'You selected several experiences. Focus first on the two that matter most to you.':'你选择了多种经历。先挑其中最重要的两项思考。');
   para(data.e1close);
 }else if(step===1){
   const skills=responses.checks3.slice().sort((a,b)=>a-b);
   if(!skills.length)para(data.nochoice);
   skills.slice(0,2).forEach(i=>para(data.e2skill[i]));
   if(skills.length>2)para(lang==='en'?'You selected several possibilities. Try just one or two before adding more.':'你选择了多种可能的能力。先尝试其中一两项即可。');
   para(data.e2close);
 }else{
   if(responses.focus===null){para(data.e3empty)}else{
     para(data.e3pick);
     const examples=data.e3examples[responses.focus];
     examples.slice(1).forEach((v,i)=>para((i+1)+'. '+v));
   }
   para(data.e3close);
 }
}
function render(){staticText();$('exercise').classList.remove('hidden');$('finishPage').classList.add('hidden');$('progresslabel').textContent=t('progress').replace('{n}',step+1);$('countlabel').textContent=t('count');$('progress').setAttribute('aria-valuenow',step+1);$('fill').style.width=(step+1)/3*100+'%';const p='e'+(step+1);$('exTitle').textContent=t(p+'title');$('exIntro').textContent=t(p+'intro');const f=$('fields');f.replaceChildren();if(step===0){f.append(makeCheckGroup(t('e1q1'),t('e1options1'),'checks1'),makeCheckGroup(t('e1q2'),t('e1options2'),'checks2'),makeText(t('e1q3'),'reflect1',t('e1placeholder'),t('e1help')))}else if(step===1){f.append(makeCheckGroup(t('e2q1'),t('e2options'),'checks3'),makeText(t('e2q2'),'reflect2',t('e2placeholder'),t('e2help')))}else{f.append(makeCheckGroup(t('e3q1'),t('e3options'),'focus',true));const h=document.createElement('h3');h.textContent=t('e3q2');f.append(h,makeText(t('e3prompt'),'reflect3',t('e3placeholder'),t('e3help')))}for(let i=1;i<=3;i++)$('take'+i).textContent=t(p+'take'+i)||'';updateTailored();$('exerciseFeedback').classList.toggle('hidden',!feedbackSeen[step]);$('prev').textContent=t('prev');$('prev').disabled=step===0;$('next').textContent=feedbackSeen[step]?(step===2?t('finish'):t('next')):t('showFeedback');}
function showFinish(){staticText();$('exercise').classList.add('hidden');$('finishPage').classList.remove('hidden');$('response1').textContent=responses.reflect1.trim()||t('notWritten');$('response2').textContent=responses.reflect2.trim()||t('notWritten');const v=responses.reflect3.trim();$('response3').textContent=(responses.focus===null?'':t('e3options')[responses.focus][0]+(v?' — ':''))+(v||(!Number.isInteger(responses.focus)?t('notWritten'):''));$('copyStatus').textContent='';$('finishPage').focus();$('finishPage').scrollIntoView({block:'start',behavior:'smooth'});}
$('prev').addEventListener('click',()=>{if(step>0){step--;render();$('exercise').scrollIntoView({block:'start',behavior:'smooth'})}});$('next').addEventListener('click',()=>{if(!feedbackSeen[step]){feedbackSeen[step]=true;render();$('exerciseFeedback').focus();$('exerciseFeedback').scrollIntoView({block:'nearest',behavior:'smooth'});return;}if(step<2){step++;render();$('exercise').scrollIntoView({block:'start',behavior:'smooth'})}else showFinish()});
for(const language of ['en','zh'])$(language).addEventListener('click',()=>{lang=language;if($('finishPage').classList.contains('hidden'))render();else showFinish()});
$('restart').addEventListener('click',()=>{feedbackSeen.fill(false);step=0;responses.checks1=[];responses.checks2=[];responses.reflect1='';responses.checks3=[];responses.reflect2='';responses.focus=null;responses.reflect3='';render();$('exercise').scrollIntoView({block:'start',behavior:'smooth'})});
$('copy').addEventListener('click',async()=>{const output=[[t('summary1'),responses.reflect1.trim()],[t('summary2'),responses.reflect2.trim()],[t('summary3'),(responses.focus===null?'':t('e3options')[responses.focus][0]+'\n')+responses.reflect3.trim()]].filter(x=>x[1]).map(x=>x[0]+'\n'+x[1]).join('\n\n');if(!output){$('copyStatus').textContent=t('empty');return}try{await navigator.clipboard.writeText(output);$('copyStatus').textContent=t('copied')}catch(e){$('copyStatus').textContent=t('copyfail')}});
render();</script></body></html>
